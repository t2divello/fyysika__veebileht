<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vastastikmoju-ja-joud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Literata:opsz,wght@18..72,400;18..72,500;18..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1720;
  --bg-alt:#141f2a;
  --grid-line:rgba(237,234,224,0.055);
  --ink:#edeae0;
  --ink-dim:#aab2bd;
  --ink-faint:#6d7684;
  --chalk-yellow:#f2c94c;
  --chalk-yellow-dim:#8a752f;
  --teal:#5fb4a2;
  --teal-dim:#355f57;
  --coral:#e08a6b;
  --card-bg:#16212c;
  --card-border:rgba(237,234,224,0.09);
  --radius:10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar{display:none;}
body{scrollbar-width:none; -ms-overflow-style:none;}
body::-webkit-scrollbar{display:none;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    var(--bg);
  color:var(--ink);
  font-family:'Literata', serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mono,nav,.tag,.eyebrow,button,.btn{font-family:'Space Mono', monospace;}
::selection{background:var(--chalk-yellow); color:#141f2a;}
a{color:inherit;}

a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--chalk-yellow); outline-offset:3px; border-radius:4px;
}

.wrap{max-width:min(1180px, 92vw); margin:0 auto; padding:0 24px;}

nav{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(8px);
  background:rgba(15,23,32,0.82);
  border-bottom:1px solid var(--card-border);
}
.nav-inner{
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 0;
}
.logo{display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:0.5px;}
.logo-dot{width:8px; height:8px; border-radius:50%; background:var(--chalk-yellow);}
.nav-links{display:flex; gap:28px; font-size:13px; color:var(--ink-dim);}
.nav-link{cursor:pointer; transition:color .15s;}
.nav-link:hover{color:var(--ink);}

.hero{padding:90px 24px 60px; position:relative; overflow:hidden;}
#field-canvas{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;}
.hero-scrim{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 400px 280px at 30% 40%, rgba(15,23,32,0.82) 0%, rgba(15,23,32,0.55) 45%, rgba(15,23,32,0.1) 75%, rgba(15,23,32,0) 90%);}
.hero > *:not(#field-canvas):not(.hero-scrim){position:relative; z-index:1;}
.eyebrow{
  font-size:12px; color:var(--teal); letter-spacing:1.5px; text-transform:uppercase;
  display:flex; align-items:center; gap:10px; margin-bottom:22px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--teal);}
h1.headline{
  font-size:clamp(32px, 5.5vw, 52px); line-height:1.12; font-weight:700;
  margin:0 0 20px; max-width:680px; letter-spacing:-0.5px;
}
.headline em{font-style:normal; color:var(--chalk-yellow);}
.sub{font-size:17px; line-height:1.7; color:var(--ink-dim); max-width:480px; margin:0 0 32px;}
.hero-cta{display:flex; gap:14px; align-items:center;}
.btn{
  font-size:13px; padding:12px 20px; border-radius:6px; border:1px solid var(--card-border);
  background:transparent; color:var(--ink); cursor:pointer; letter-spacing:0.3px;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--ink-faint); background:rgba(237,234,224,0.04);}
.btn.primary{background:var(--chalk-yellow); color:#1a1408; border-color:var(--chalk-yellow); font-weight:700;}
.btn.primary:hover{background:#f6d876;}

.traj-wrap{margin-top:56px; border:1px solid var(--card-border); border-radius:12px; background:var(--card-bg); padding:20px 24px;}
.traj-tabs{display:flex; gap:8px; margin-bottom:16px;}
.traj-tab{
  font-family:'Space Mono', monospace; font-size:11.5px; padding:6px 12px; border-radius:6px;
  border:1px solid var(--card-border); background:transparent; color:var(--ink-faint); cursor:pointer;
  transition:all .15s;
}
.traj-tab:hover{color:var(--ink-dim); border-color:var(--ink-faint);}
.traj-tab.active{background:var(--chalk-yellow); color:#1a1408; border-color:var(--chalk-yellow); font-weight:700;}
.traj-view{display:none;}
.traj-view.active{display:block;}
.traj-readout{display:flex; gap:28px; font-size:12px; color:var(--ink-faint); margin-bottom:10px;}
.traj-readout b{color:var(--teal); font-weight:400;}
#traj-svg, #osc-svg, #circ-svg{width:100%; height:auto; display:block;}
.traj-path{fill:none; stroke:var(--ink-faint); stroke-width:1.5; stroke-dasharray:4 5;}
.traj-dot{fill:var(--chalk-yellow);}
.traj-axis{stroke:var(--card-border); stroke-width:1;}

.section{padding:64px 24px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:8px;}
.section-head h2{font-size:20px; font-weight:700; margin:0;}
.section-head .count{font-size:12px; color:var(--ink-faint);}

.topics{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; perspective:900px;}
@media(max-width:720px){.topics{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){.topics{grid-template-columns:1fr;}}
.topic-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:20px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .15s ease-out, border-color .18s ease;
  transform-style:preserve-3d; will-change:transform;
}
.topic-card:hover{border-color:var(--ink-faint);}
.topic-card .num{
  position:absolute; top:14px; right:16px; font-size:11px; color:var(--ink-faint);
}
.topic-card .icon{font-size:22px; margin-bottom:14px; display:block;}
.topic-card h3{font-size:15px; font-weight:700; margin:0 0 6px; line-height:1.35;}
.topic-card p{font-size:12.5px; color:var(--ink-dim); margin:0; font-family:'Literata',serif; line-height:1.5;}
.topic-card .arrow{margin-top:14px; font-size:12px; color:var(--teal); display:flex; align-items:center; gap:5px;}

#detail-view{display:none;}
.back-link{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim);
  background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px;
}
.back-link:hover{color:var(--ink);}
.detail-title{font-size:26px; font-weight:700; margin:0 0 6px;}
.detail-sub{font-size:13px; color:var(--ink-faint); margin:0 0 32px;}

.cat-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;}
@media(max-width:600px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  overflow:hidden; transition:transform .18s ease, border-color .18s ease; cursor:pointer;
}
.cat-card:hover{transform:translateY(-3px); border-color:var(--ink-faint);}
.cat-head{
  padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
}
#category-page, #exercises-page, #about-page{display:none;}

#category-page{position:relative; overflow:hidden; isolation:isolate;}
#category-field{position:absolute; inset:0; width:100%; height:100%; z-index:-2; pointer-events:none;}
.category-field-scrim{position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse 620px 430px at 52% 38%, rgba(15,23,32,0.38) 0%, rgba(15,23,32,0.70) 58%, rgba(15,23,32,0.94) 100%);}
#category-page > *:not(#category-field):not(.category-field-scrim){position:relative; z-index:1;}

.cat-page-eyebrow{font-size:12px; color:var(--teal); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;}
.ex-topic-group{margin-bottom:28px;}
.ex-topic-group h4{font-size:14px; margin:0 0 10px; color:var(--ink-dim);}
.cat-head-left{display:flex; align-items:center; gap:12px;}
.cat-icon{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.cat-icon.formula{background:rgba(95,180,162,0.15); color:var(--teal);}
.cat-icon.text{background:rgba(242,201,76,0.15); color:var(--chalk-yellow);}
.cat-icon.video{background:rgba(224,138,107,0.15); color:var(--coral);}
.cat-icon.exercise{background:rgba(174,161,255,0.15); color:#b3a8ec;}
.cat-head h4{font-size:14.5px; font-weight:700; margin:0 0 2px;}
.cat-head p{font-size:11.5px; color:var(--ink-faint); margin:0;}
.chevron{font-size:12px; color:var(--ink-faint); transition:transform .2s;}
.cat-card.open .chevron{transform:rotate(180deg);}
.cat-body{max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:1px solid transparent;}
.cat-card.open .cat-body{border-top:1px solid var(--card-border);}
.cat-body-inner{padding:20px;}

.sim-row{display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:13px;}
.sim-row label{width:118px; color:var(--ink-dim); flex-shrink:0;}
.sim-row input[type=range]{flex:1; accent-color:var(--teal);}
.sim-row .val{width:80px; text-align:right; color:var(--teal); font-family:'Space Mono',monospace; font-size:12.5px;}
.sim-formula{
  background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px;
  padding:14px 16px; font-size:15px; text-align:center; margin:14px 0; color:var(--chalk-yellow);
}
canvas#sim-canvas, stage#sim-stage{width:100%; height:220px; display:block; background:var(--bg-alt); border-radius:8px; border:1px solid var(--card-border); margin-top:6px;}

/* formula reference grid (Kinemaatika-style card grid) */
.formula-ref-title{font-size:16px; font-weight:700; margin:0 0 16px; color:var(--ink);}
.formula-ref-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin-bottom:28px;}
@media(max-width:600px){.formula-ref-grid{grid-template-columns:1fr;}}
.formula-ref-card{border:1px solid var(--card-border); border-radius:10px; padding:16px; background:var(--card-bg);}
.formula-ref-label{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; font-family:'Space Mono',monospace;}
.formula-ref-box{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:14px 16px; text-align:center;}
.formula-ref-eq{font-family:'Space Mono',monospace; font-size:16px; color:var(--chalk-yellow);}

/* Interactive Crate Simulation inside Category Page */
.sim-layout{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-bottom:32px;}
@media(max-width:860px){.sim-layout{grid-template-columns:1fr;}}
.sim-panel{background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px;}
.sim-readouts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.sim-readout{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:10px 12px;}
.sim-readout .k{font-size:11px; color:var(--ink-faint); font-family:'Space Mono',monospace; letter-spacing:0.3px;}
.sim-readout .v{font-size:16px; color:var(--chalk-yellow); font-family:'Space Mono',monospace; margin-top:3px;}
.sim-readout .v small{color:var(--ink-faint); font-size:11px; margin-left:3px;}

.formula-group{margin-bottom:20px;}
.formula-group:last-child{margin-bottom:0;}
.formula-group h4{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px;}
.formula-card{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.formula-card:last-child{margin-bottom:0;}
.formula-card .expr{font-family:'Space Mono',monospace; color:var(--chalk-yellow);}
.formula-card .live{font-family:'Space Mono',monospace; color:var(--teal); font-size:13px;}

/* measurement simulators */
.msim-block{
  margin-bottom:28px;
  padding:18px;
  border:1px solid var(--card-border);
  border-radius:10px;
  background:linear-gradient(200deg, rgba(20,31,42,0.82) 0%, rgba(16,25,34,0.55) 55%, rgba(15,23,32,0.3) 100%);
  position:relative;
  overflow:hidden;
}
.msim-block::before{
  content:"";
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 14% 18%, rgba(242,201,76,0.09), transparent 34%),
    radial-gradient(circle at 85% 82%, rgba(95,180,162,0.10), transparent 30%);
}
.msim-block > *{position:relative; z-index:1;}
.msim-block:last-child{margin-bottom:0;}
.msim-block h5{font-size:13.5px; font-weight:700; margin:0 0 12px; color:var(--ink);}
.msim-result{font-size:14px; color:var(--teal); font-family:'Space Mono',monospace; margin:10px 0;}
.msim-scale{position:relative; height:64px; margin:20px 4px 6px;}
.msim-line{position:absolute; left:0; right:0; top:30px; height:5px; background:var(--card-border); border-radius:4px;}
.msim-range{position:absolute; top:20px; height:24px; border-radius:5px; background:rgba(95,180,162,0.3); border:1px solid rgba(95,180,162,0.5);}
.msim-marker{position:absolute; top:12px; width:2px; height:40px; background:var(--chalk-yellow);}
.msim-legend{display:flex; gap:20px; font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.msim-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; background:var(--chalk-yellow);}
.msim-dot.teal{background:rgba(95,180,162,0.6);}
.msim-barbox{display:flex; align-items:flex-end; gap:12px; height:120px; border-bottom:1px solid var(--card-border); padding:0 8px; margin-top:14px;}
.msim-bar{width:52px; border-radius:5px 5px 0 0; text-align:center; font-size:10.5px; padding-top:4px; color:#0f1720; font-weight:700; font-family:'Space Mono',monospace; transition:height .15s;}
.msim-bar.value{background:var(--teal);}
.msim-bar.error{background:var(--coral);}
.msim-measure-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; min-height:28px;}
.msim-measure{padding:5px 10px; border-radius:6px; background:var(--bg-alt); border:1px solid var(--card-border); font-size:11.5px; font-family:'Space Mono',monospace; color:var(--teal);}
.msim-note{font-size:12.5px; color:var(--ink-faint); margin-top:10px; line-height:1.6;}
.msim-btnrow{display:flex; gap:10px; margin-top:4px;}

.explain-item{border-bottom:1px solid var(--card-border); padding:12px 0;}
.explain-item:last-child{border-bottom:none;}
.explain-item summary{cursor:pointer; font-size:13.5px; font-weight:700; list-style:none; display:flex; justify-content:space-between;}
.explain-item summary::-webkit-details-marker{display:none;}
.explain-item p{font-size:14px; line-height:1.7; color:var(--ink-dim); margin:10px 0 0; font-family:'Literata',serif;}

.video-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media(max-width:500px){.video-grid{grid-template-columns:1fr;}}
.video-item{background:var(--bg-alt); border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid var(--card-border);}
.video-thumb{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative; background:linear-gradient(135deg, rgba(224,138,107,0.12), rgba(224,138,107,0.03));}
.play-btn{width:36px; height:36px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; color:#1a1408; font-size:13px;}
.video-item .vlabel{padding:10px 12px; font-size:12px; color:var(--ink-dim);}

.ex-item{border:1px solid var(--card-border); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
.ex-item:last-child{margin-bottom:0;}
.ex-q{font-size:13.5px; margin:0 0 10px;}
.ex-row{display:flex; gap:8px;}
.ex-row input[type=text]{
  flex:1; background:var(--bg-alt); border:1px solid var(--card-border); border-radius:6px;
  color:var(--ink); padding:8px 10px; font-size:13px; font-family:'Space Mono',monospace;
}
.ex-row button{font-size:12px; padding:8px 14px;}
.ex-feedback{font-size:12px; margin-top:8px; display:none;}
.ex-feedback.correct{color:var(--teal); display:block;}
.ex-feedback.wrong{color:var(--coral); display:block;}

footer{padding:40px 24px; border-top:1px solid var(--card-border); text-align:center; font-size:11.5px; color:var(--ink-faint);}
</style>
</head>
<body>

<section class="section wrap" id="detail-view">
  <button class="back-link" onclick="goHome()">← kõik teemad</button>
  <h2 class="detail-title" id="detail-title"></h2>
  <p class="detail-sub" id="detail-sub"></p>
  <div class="cat-grid" id="cat-grid"></div>
</section>

<section class="section wrap" id="category-page">
  <canvas id="category-field" aria-hidden="true"></canvas>
  <div class="category-field-scrim" aria-hidden="true"></div>
  <button class="back-link" id="cat-back-link">← tagasi teema juurde</button>
  <div class="cat-page-eyebrow" id="cat-page-eyebrow"></div>
  <h2 class="detail-title" id="cat-page-title"></h2>
  <p class="detail-sub" id="cat-page-sub"></p>
  <div id="cat-page-content"></div>
</section>

<script>
const topics = [
  {name:"Vastastikmõju ja jõud", tag:"Newtoni seadused", icon:"⇄", lessons:8,
    formulaHTML:`
      <div class="formula-ref-title">Interaktiivne simulatsioon: Kasti lükkamine & Newtoni II seadus</div>
      
      <div class="sim-layout">
        <div class="sim-panel">
          <canvas id="crate-stage" style="width:100%; height:220px; display:block; background:var(--bg-alt); border-radius:8px; border:1px solid var(--card-border);"></canvas>

          <div style="margin-top:18px; display:flex; flex-direction:column; gap:14px;">
            <div class="sim-row">
              <label>mass m</label>
              <input type="range" id="ctrl-m" min="1" max="40" step="1" value="10">
              <span class="val" id="ctrl-m-out">10 kg</span>
            </div>
            <div class="sim-row">
              <label>jõud F</label>
              <input type="range" id="ctrl-F" min="0" max="80" step="1" value="25">
              <span class="val" id="ctrl-F-out">25 N</span>
            </div>
            <div class="sim-row">
              <label>hõõrdejõud f</label>
              <input type="range" id="ctrl-fr" min="0" max="30" step="1" value="6">
              <span class="val" id="ctrl-fr-out">6 N</span>
            </div>
            <div style="display:flex; gap:10px; margin-top:6px;">
              <button class="btn primary" id="btn-play">Peata</button>
              <button class="btn" id="btn-reset">Lähtesta</button>
            </div>
          </div>

          <div class="sim-readouts">
            <div class="sim-readout"><div class="k">netojõud F − f</div><div class="v" id="ro-Fnet">0<small>N</small></div></div>
            <div class="sim-readout"><div class="k">kiirendus a</div><div class="v" id="ro-a">0.0<small>m/s²</small></div></div>
            <div class="sim-readout"><div class="k">kiirus v</div><div class="v" id="ro-v">0.0<small>m/s</small></div></div>
            <div class="sim-readout"><div class="k">läbitud tee s</div><div class="v" id="ro-s">0.0<small>m</small></div></div>
          </div>
        </div>

        <div class="sim-panel">
          <div class="formula-group">
            <h4>Newtoni II seadus</h4>
            <div class="formula-card"><span class="expr">F = ma</span><span class="live" id="fv-1"></span></div>
            <div class="formula-card"><span class="expr">a = F : m</span><span class="live" id="fv-2"></span></div>
          </div>
          <div class="formula-group">
            <h4>Netojõud koos hõõrdumisega</h4>
            <div class="formula-card"><span class="expr">F_net = F − f</span><span class="live" id="fv-3"></span></div>
            <div class="formula-card"><span class="expr">a = F_net : m</span><span class="live" id="fv-4"></span></div>
          </div>
          <div class="formula-group">
            <h4>Kiirus ja teepikkus (kui a on konstantne)</h4>
            <div class="formula-card"><span class="expr">v = at</span><span class="live" id="fv-5"></span></div>
            <div class="formula-card"><span class="expr">s = at² : 2</span><span class="live" id="fv-6"></span></div>
          </div>
        </div>
      </div>

      <div class="formula-ref-title">Kinemaatika ja dünaamika põhivalemid</div>
      <div class="formula-ref-grid">
        <div class="formula-ref-card">
          <div class="formula-ref-label">Kiirus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">v = Δs / Δt</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Kiirendus</div>

      <details class="explain-item" open><summary>Deformatsioon ja Hooke'i seadus <span>+</span></summary>
        <p><b>Deformatsioon</b> on keha kuju ja mõõtmete muutumine välise jõu toimel. Kui välise mõju lakkamisel taastub keha esialgne kuju, on tegemist <b>elastse deformatsiooniga</b>, vastasel juhul aga <b>plastilise deformatsiooniga</b>.</p>

      <details class="explain-item"><summary>Newtoni III seadus (mõju ja vastumõju) <span>+</span></summary>
        <p>Newtoni kolmas seadus väidab, et kaks keha mõjutavad teineteist alati suuruselt võrdsete ja suunalt vastupidiste jõududega (F₁ = −F₂). Need jõud tekivad paarikaupa, on sama liiki ja mõjuvad üheaegselt.</p>

      <details class="explain-item"><summary>Levinud vead <span>+</span></summary>
        <p><b>Massi ja kaalu segamine:</b> öeldakse, et "kaal on 70 kg", kuigi massi mõõdetakse kilogrammides ja kaal on njuutonites (N) mõõdetav jõud.</p>
        <p><b>Raskusjõu ja kaalu samastamine:</b> raskusjõud on Maa külgetõmbejõud kehale, kuid kaal on keha avaldatav jõud toele või riputile.</p>
        <p><b>Eksiarvamus liikumise tekkimisest:</b> arvatakse, et keha liikumiseks on vaja jõudu, kuigi jõud on vajalik vaid liikumise muutmiseks ehk kiirenduseks.</p>
      </details>

      <details class="explain-item"><summary>Kokkuvõte <span>+</span></summary>
        <p>Kehade liikumist ja vastastikmõjusid kirjeldavad füüsikas jõud ja Newtoni seadused. <b>Deformatsioon</b> on keha kuju muutumine, mille käigus tekib esialgset kuju taastav elastsusjõud (F<sub>e</sub> = −k·Δl). Pindade kokkupuutel takistab liikumist <b>hõõrdejõud</b> (F<sub>h</sub> = μN), mis muundab liikumisenergia soojuseks.</p>

        <p><b>I seadus (inertsiseadus):</b> tasakaalustatud jõudude korral keha kiirus ei muutu (ΣF = 0 ⟹ a = 0).</p>
        <p><b>II seadus (dünaamika põhiseadus):</b> jõud tekitab kehale kiirenduse (a = F / m).</p>
        <p><b>III seadus (mõju ja vastumõju):</b> kehad mõjutavad teineteist võrdsete ja vastassuunaliste jõududega (F₁ = −F₂).</p>
        <p>Kõik massiga kehad tõmbuvad gravitatsioonijõu tõttu (F<sub>gr</sub> = G·m₁m₂ / r²). Maapinnal avaldub see raskusjõuna (F = mg), mis tekitab tuge vajutava või riputit tõmbava keha kaalu (P = m(g ± a)).</p>
      </details>

          <p style="margin:0;"><b style="color:var(--ink);">Jäikuskordaja (k):</b> keha omadus (ühik N/m), mis näitab, kui suurt jõudu on vaja rakendada keha pikkuse muutmiseks ühe ühiku võrra.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Hõõrdejõud (F<sub>h</sub>):</b> kokkupuutuvate pindade vahel tekkiv jõud, mis takistab kehade suhtelist liikumist.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Hõõrdetegur (μ):</b> ühikuta suurus, mis iseloomustab kokkupuutuvate pindade karedust ja materjali.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Inerts:</b> keha füüsikaline omadus säilitada oma liikumisolekut (paigalseisu või ühtlast sirgjoonelist liikumist).</p>
          <p style="margin:0;"><b style="color:var(--ink);">Mass (m):</b> keha inertsuse ja gravitatsioonilise mõju mõõt (SI-ühik kg).</p>
          <p style="margin:0;"><b style="color:var(--ink);">Kiirendus (a):</b> füüsikaline suurus, mis näitab liikumiskiiruse muutumise kiirust ajaühikus.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Gravitatsioon:</b> universaalne loodusjõud, millega kõik massiga kehad teineteist tõmbavad.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Raskusjõud (F):</b> taevakeha (nt Maa) lähedal asuvale kehale mõjuv gravitatsioonijõud (F = mg).</p>
          <p style="margin:0;"><b style="color:var(--ink);">Keha kaal (P):</b> jõud, millega keha vajutab tuge või tõmbab riputit gravitatsiooni tõttu.</p>
        </div>
      </details>
    `}
];

const categories = [
  {key:'formula', icon:'ƒ', cls:'formula', title:'Valemid ja simulatsioonid', sub:'Interaktiivne arvutaja'},
  {key:'explain', icon:'§', cls:'text', title:'Selgitused', sub:'Teooria lühidalt'},
  {key:'video', icon:'▶', cls:'video', title:'Videod', sub:'Lühikesed videotunnid'},
  {key:'exercise', icon:'✓', cls:'exercise', title:'Ülesanded', sub:'Kontrolli oma teadmisi'}
];

let currentTopicIndex = 0;

function buildCategories(t){
  const catGrid = document.getElementById('cat-grid');
  catGrid.innerHTML = '';
  const hidden = t.hideCategories || [];
  categories.filter(c=>!hidden.includes(c.key)).forEach(c=>{
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `<div class="cat-head">
      <div class="cat-head-left"><div class="cat-icon ${c.cls}">${c.icon}</div><div><h4>${c.title}</h4><p>${c.sub}</p></div></div>
      <span class="chevron" style="transform:rotate(-90deg);">⌄</span>
    </div>`;
    card.addEventListener('click', ()=>openCategoryPage(currentTopicIndex, c.key));
    catGrid.appendChild(card);
  });
}

function openCategoryPage(topicIndex, catKey){
  currentTopicIndex = topicIndex;
  const t = topics[topicIndex];
  const cat = categories.find(c=>c.key===catKey);
  hideAllViews();
  document.getElementById('category-page').style.display = 'block';
  document.getElementById('cat-page-eyebrow').textContent = t.name;
  document.getElementById('cat-page-title').textContent = cat.title;
  document.getElementById('cat-page-sub').textContent = cat.sub;
  document.getElementById('cat-back-link').onclick = ()=>{ hideAllViews(); document.getElementById('detail-view').style.display='block'; window.scrollTo({top:0}); };

  const content = document.getElementById('cat-page-content');
  if(catKey==='formula'){
    if(t.formulaHTML){
      content.innerHTML = t.formulaHTML;
      if(t.formulaInit) t.formulaInit();
    } else {
      content.innerHTML = `
        <div class="sim-row"><label>kiirus v</label><input type="range" id="sim-v" min="1" max="30" value="10" oninput="runSim()"><span class="val" id="sim-v-out">10 m/s</span></div>
        <div class="sim-row"><label>aeg t</label><input type="range" id="sim-t" min="1" max="20" value="5" oninput="runSim()"><span class="val" id="sim-t-out">5 s</span></div>
        <div class="sim-formula" id="sim-formula">s = v · t = 50 m</div>
        <canvas id="sim-canvas"></canvas>
        <p style="font-size:13px; color:var(--ink-faint); margin-top:14px;">Liiguta liugureid ja jälgi, kuidas teekond s muutub ajas. Graafik joonistub reaalajas.</p>`;

      <details class="explain-item" open><summary>Mis on ${t.name.toLowerCase()}? <span>+</span></summary><p>Selles peatükis vaatame nähtust selle põhiomaduste kaudu ja seome selle igapäevaste näidetega, enne kui liigume valemite juurde.</p></details>
      <details class="explain-item"><summary>Peamised valemid <span>+</span></summary><p>Iga valem on tuletatud lihtsamatest suurustest ja seda saab valemite lehel ise katsetada.</p></details>
      <details class="explain-item"><summary>Levinud vead <span>+</span></summary><p>Tähelepanu tasub pöörata ühikutele ja märkidele, need on kõige sagedasem eksimuskoht kontrolltöödes.</p></details>
      <details class="explain-item"><summary>Kokkuvõte <span>+</span></summary><p>Enne järgmise tunni juurde minekut veendu, et suudad selgitada peamised mõisted oma sõnadega.</p></details>`;
  } else if(catKey==='video'){
    content.innerHTML = `<div class="video-grid" id="video-grid"></div>`;
    const vids = document.getElementById('video-grid');

      {title:'Näidisülesanne koos lahenduskäiguga', url:'https://www.youtube.com/results?search_query='+encodeURIComponent(t.name+' füüsika'), desc:'Samm-sammuline juhend tüüpiliste ülesannete lahendamiseks.'},
      {title:'Kordamine ja kokkuvõte', url:'https://www.youtube.com/results?search_query='+encodeURIComponent(t.name+' füüsika'), desc:'Süstematiseeritud kokkuvõte kontrolltööks valmistumiseks.'}
    ];
    videoList.forEach(v=>{
      const item = document.createElement('div');
      item.className = 'video-item';
      item.innerHTML = `<div class="video-thumb"><div class="play-btn">▶</div></div><div class="vlabel"><div style="font-weight:700; color:var(--ink); font-size:13.5px; margin-bottom:4px;">${v.title}</div><p style="margin:0; font-size:12px; color:var(--ink-dim); font-family:'Literata', serif; line-height:1.4;">${v.desc}</p></div>`;
      item.addEventListener('click', ()=>window.open(v.url, '_blank'));
      vids.appendChild(item);
    });
  } else if(catKey==='exercise'){
    content.innerHTML = `<div id="ex-list"></div>`;

function renderExerciseList(container, exercises, prefix){
  exercises.forEach((ex,i)=>{
    const item = document.createElement('div');
    item.className = 'ex-item';
    item.innerHTML = `<p class="ex-q">${i+1}. ${ex.q}</p>
      <div class="ex-row"><input type="text" placeholder="vastus" id="${prefix}ex-input-${i}"><button class="btn" onclick="checkEx('${prefix}', ${i}, '${ex.a}')">Kontrolli</button></div>
      <p class="ex-feedback" id="${prefix}ex-fb-${i}"></p>`;
    container.appendChild(item);
  });
}

function hideAllViews(){
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('category-page').style.display = 'none';
}

function checkEx(prefix, i, answer){
  const input = document.getElementById(prefix+'ex-input-'+i).value.trim().replace(',', '.');
  const fb = document.getElementById(prefix+'ex-fb-'+i);
  if(input === answer){
    fb.textContent = 'Õige!';
    fb.className = 'ex-feedback correct';
  } else {
    fb.textContent = 'Proovi uuesti. Kontrolli ühikuid ja arvutuskäiku.';
    fb.className = 'ex-feedback wrong';
  }
}

/* Kasti lükkamise simulatsiooni funktsioon */
let crateSimAnimId = null;
function initCrateSim(){
  if(crateSimAnimId) cancelAnimationFrame(crateSimAnimId);
  const stage = document.getElementById('crate-stage');
  if(!stage) return;
  const ctx = stage.getContext('2d');

  const mSlider = document.getElementById('ctrl-m');
  const FSlider = document.getElementById('ctrl-F');
  const frSlider = document.getElementById('ctrl-fr');
  const mOut = document.getElementById('ctrl-m-out');
  const FOut = document.getElementById('ctrl-F-out');
  const frOut = document.getElementById('ctrl-fr-out');
  const playBtn = document.getElementById('btn-play');
  const resetBtn = document.getElementById('btn-reset');

  let m = parseFloat(mSlider.value);
  let F = parseFloat(FSlider.value);
  let fr = parseFloat(frSlider.value);
  let v = 0, s = 0;
  let running = true, lastTs = null;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = stage.clientWidth, h = stage.clientHeight;
    stage.width = w*dpr; stage.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  mSlider.oninput = ()=>{ m=parseFloat(mSlider.value); mOut.textContent=m+' kg'; };
  FSlider.oninput = ()=>{ F=parseFloat(FSlider.value); FOut.textContent=F+' N'; };
  frSlider.oninput = ()=>{ fr=parseFloat(frSlider.value); frOut.textContent=fr+' N'; };
  mOut.textContent=m+' kg'; FOut.textContent=F+' N'; frOut.textContent=fr+' N';

  playBtn.onclick = ()=>{ running=!running; playBtn.textContent = running?'Peata':'Jätka'; };
  resetBtn.onclick = ()=>{ v=0; s=0; };

  function fmt(n,d=2){ return isFinite(n)? n.toFixed(d) : '—'; }

  function drawCrate(x, y, size){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = '#c98a4f';
    ctx.fillRect(-size/2, -size, size, size);
    ctx.strokeStyle = 'rgba(15,23,32,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-size/2, -size, size, size);
    ctx.beginPath();
    ctx.moveTo(-size/2, -size); ctx.lineTo(size/2, 0);
    ctx.moveTo(size/2, -size); ctx.lineTo(-size/2, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawArrow(x1,y1,x2,y2,color){
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const ang = Math.atan2(y2-y1,x2-x1), ah=8;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-ah*Math.cos(ang-0.4), y2-ah*Math.sin(ang-0.4));
    ctx.lineTo(x2-ah*Math.cos(ang+0.4), y2-ah*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }

  function draw(){
    const w = stage.clientWidth, h = stage.clientHeight;
    ctx.clearRect(0,0,w,h);
    const floorY = h*0.78;

    ctx.strokeStyle = 'rgba(237,234,224,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(w,floorY); ctx.stroke();

    const size = 46;
    const margin = 60;
    const usable = w - margin*2 - size;
    let px = margin + (s*10) % usable;
    if(usable <= 0) px = margin;

    drawCrate(px, floorY, size);

    const fLen = Math.min(80, F*1.2);
    drawArrow(px + size*0.6, floorY-size*0.5, px + size*0.6 + fLen, floorY-size*0.5, '#5fb4a2');
    ctx.fillStyle = '#5fb4a2';
    ctx.font = '11px "Space Mono", monospace';
    ctx.fillText('F', px + size*0.6 + fLen + 6, floorY-size*0.5+4);

    const frLen = Math.min(70, fr*1.2);
    if(frLen>2){
      drawArrow(px - size*0.6, floorY-size*0.35, px - size*0.6 - frLen, floorY-size*0.35, '#e08a6b');
      ctx.fillStyle = '#e08a6b';
      ctx.fillText('f', px - size*0.6 - frLen - 12, floorY-size*0.35+4);
    }
  }

  function step(ts){
    if(!document.getElementById('crate-stage')) return;
    if(lastTs===null) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;

    const netF = Math.max(0, F - fr);
    const a = netF / m;

    if(running){
      v += a*dt;
      if(netF<=0 && v>0){ v = Math.max(0, v - (fr/m)*dt); }
      s += v*dt;
    }

    draw();

    const roFnet = document.getElementById('ro-Fnet');
    if(roFnet){
      roFnet.innerHTML = fmt(netF,1)+'<small>N</small>';
      document.getElementById('ro-a').innerHTML = fmt(a,2)+'<small>m/s²</small>';
      document.getElementById('ro-v').innerHTML = fmt(v,2)+'<small>m/s</small>';
      document.getElementById('ro-s').innerHTML = fmt(s,2)+'<small>m</small>';

      document.getElementById('fv-1').textContent = `F = ${F} N`;
      document.getElementById('fv-2').textContent = `a = ${fmt(a,2)} m/s²`;
      document.getElementById('fv-3').textContent = `F_net = ${fmt(netF,1)} N`;
      document.getElementById('fv-4').textContent = `a = ${fmt(a,2)} m/s²`;
      document.getElementById('fv-5').textContent = `v = ${fmt(v,2)} m/s`;
      document.getElementById('fv-6').textContent = `s = ${fmt(s,2)} m`;
    }

    crateSimAnimId = requestAnimationFrame(step);
  }
  crateSimAnimId = requestAnimationFrame(step);
}

/* subtle animated physics field behind simulation pages */
(function(){
  const canvas=document.getElementById('category-field');
  if(!canvas) return;
  const section=document.getElementById('category-page');
  const ctx=canvas.getContext('2d');
  let w=1,h=1, particles=[], t=0;
  const mouse={x:-9999,y:-9999};
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    w=section.clientWidth; h=section.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr;
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(34,Math.floor(w*h/15000));
    particles=Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:.6+Math.random()*1.5,phase:Math.random()*Math.PI*2,
      speed:.006+Math.random()*.014,orbit:20+Math.random()*70
    }));
  }
  resize(); window.addEventListener('resize',resize);
  section.addEventListener('mousemove',e=>{const r=section.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  section.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;});
  function frame(){
    t+=.008; ctx.clearRect(0,0,w,h);
    ctx.save();
    for(let i=0;i<7;i++){
      const cx=w*(.12+i*.14), cy=h*(.18+Math.sin(t*.35+i)*.06), rx=90+i*34, ry=55+i*20;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,Math.sin(i)*.35,0,Math.PI*2);
      ctx.strokeStyle=`rgba(95,180,162,${.025+i*.004})`; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();
    particles.forEach(p=>{
      p.phase+=p.speed;
      const ox=Math.cos(p.phase)*p.orbit*.22, oy=Math.sin(p.phase)*p.orbit*.22;
      const x=p.x+ox, y=p.y+oy;
      const d=Math.hypot(mouse.x-x,mouse.y-y), near=Math.max(0,1-d/120);
      const a=.18+near*.65+.25*(Math.sin(p.phase*2)+1)/2;
      ctx.fillStyle=`rgba(242,201,76,${Math.min(.9,a)})`;
      ctx.beginPath();ctx.arc(x,y,p.r+near*1.8,0,Math.PI*2);ctx.fill();
      if(near>.05){ctx.strokeStyle=`rgba(95,180,162,${near*.25})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
