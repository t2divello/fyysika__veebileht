<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kinemaatika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Literata:opsz,wght@18..72,400;18..72,500;18..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1720;
  --bg-alt:#141f2a;
  --grid-line:rgba(237,234,224,0.055);
  --ink:#edeae0;
  --ink-dim:#aab2bd;
  --ink-faint:#6d7684;
  --chalk-yellow:#f2c94c;
  --chalk-yellow-dim:#8a752f;
  --teal:#5fb4a2;
  --teal-dim:#355f57;
  --coral:#e08a6b;
  --card-bg:#16212c;
  --card-border:rgba(237,234,224,0.09);
  --radius:10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar{display:none;}
body{scrollbar-width:none; -ms-overflow-style:none;}
body::-webkit-scrollbar{display:none;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    var(--bg);
  color:var(--ink);
  font-family:'Literata', serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mono,nav,.tag,.eyebrow,button,.btn{font-family:'Space Mono', monospace;}
::selection{background:var(--chalk-yellow); color:#141f2a;}
a{color:inherit;}

a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--chalk-yellow); outline-offset:3px; border-radius:4px;
}

.wrap{max-width:min(1180px, 92vw); margin:0 auto; padding:0 24px;}

nav{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(8px);
  background:rgba(15,23,32,0.82);
  border-bottom:1px solid var(--card-border);
}
.nav-inner{
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 0;
}
.logo{display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:0.5px;}
.logo-dot{width:8px; height:8px; border-radius:50%; background:var(--chalk-yellow);}
.nav-links{display:flex; gap:28px; font-size:13px; color:var(--ink-dim);}
.nav-link{cursor:pointer; transition:color .15s;}
.nav-link:hover{color:var(--ink);}

.hero{padding:90px 24px 60px; position:relative; overflow:hidden;}
#field-canvas{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;}
.hero-scrim{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 400px 280px at 30% 40%, rgba(15,23,32,0.82) 0%, rgba(15,23,32,0.55) 45%, rgba(15,23,32,0.1) 75%, rgba(15,23,32,0) 90%);}
.hero > *:not(#field-canvas):not(.hero-scrim){position:relative; z-index:1;}
.eyebrow{
  font-size:12px; color:var(--teal); letter-spacing:1.5px; text-transform:uppercase;
  display:flex; align-items:center; gap:10px; margin-bottom:22px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--teal);}
h1.headline{
  font-size:clamp(32px, 5.5vw, 52px); line-height:1.12; font-weight:700;
  margin:0 0 20px; max-width:680px; letter-spacing:-0.5px;
}
.headline em{font-style:normal; color:var(--chalk-yellow);}
.sub{font-size:17px; line-height:1.7; color:var(--ink-dim); max-width:480px; margin:0 0 32px;}
.hero-cta{display:flex; gap:14px; align-items:center;}
.btn{
  font-size:13px; padding:12px 20px; border-radius:6px; border:1px solid var(--card-border);
  background:transparent; color:var(--ink); cursor:pointer; letter-spacing:0.3px;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--ink-faint); background:rgba(237,234,224,0.04);}
.btn.primary{background:var(--chalk-yellow); color:#1a1408; border-color:var(--chalk-yellow); font-weight:700;}
.btn.primary:hover{background:#f6d876;}

.section{padding:64px 24px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:8px;}
.section-head h2{font-size:20px; font-weight:700; margin:0;}
.section-head .count{font-size:12px; color:var(--ink-faint);}

.topics{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; perspective:900px;}
@media(max-width:720px){.topics{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){.topics{grid-template-columns:1fr;}}
.topic-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:20px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .15s ease-out, border-color .18s ease;
  transform-style:preserve-3d; will-change:transform;
}
.topic-card:hover{border-color:var(--ink-faint);}
.topic-card .num{
  position:absolute; top:14px; right:16px; font-size:11px; color:var(--ink-faint);
}
.topic-card .icon{font-size:22px; margin-bottom:14px; display:block;}
.topic-card h3{font-size:15px; font-weight:700; margin:0 0 6px; line-height:1.35;}
.topic-card p{font-size:12.5px; color:var(--ink-dim); margin:0; font-family:'Literata',serif; line-height:1.5;}
.topic-card .arrow{margin-top:14px; font-size:12px; color:var(--teal); display:flex; align-items:center; gap:5px;}

#detail-view{display:none;}
.back-link{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim);
  background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px;
}
.back-link:hover{color:var(--ink);}
.detail-title{font-size:26px; font-weight:700; margin:0 0 6px;}
.detail-sub{font-size:13px; color:var(--ink-faint); margin:0 0 32px;}

.cat-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;}
@media(max-width:600px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  overflow:hidden; transition:transform .18s ease, border-color .18s ease; cursor:pointer;
}
.cat-card:hover{transform:translateY(-3px); border-color:var(--ink-faint);}
.cat-head{
  padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
}
#category-page, #exercises-page, #about-page{display:none;}

#category-page{position:relative; overflow:hidden; isolation:isolate;}
#category-field{position:absolute; inset:0; width:100%; height:100%; z-index:-2; pointer-events:none;}
.category-field-scrim{position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse 620px 430px at 52% 38%, rgba(15,23,32,0.38) 0%, rgba(15,23,32,0.70) 58%, rgba(15,23,32,0.94) 100%);}
#category-page > *:not(#category-field):not(.category-field-scrim){position:relative; z-index:1;}

.cat-page-eyebrow{font-size:12px; color:var(--teal); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;}
.ex-topic-group{margin-bottom:28px;}
.ex-topic-group h4{font-size:14px; margin:0 0 10px; color:var(--ink-dim);}
.cat-head-left{display:flex; align-items:center; gap:12px;}
.cat-icon{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.cat-icon.formula{background:rgba(95,180,162,0.15); color:var(--teal);}
.cat-icon.text{background:rgba(242,201,76,0.15); color:var(--chalk-yellow);}
.cat-icon.video{background:rgba(224,138,107,0.15); color:var(--coral);}
.cat-icon.exercise{background:rgba(174,161,255,0.15); color:#b3a8ec;}
.cat-head h4{font-size:14.5px; font-weight:700; margin:0 0 2px;}
.cat-head p{font-size:11.5px; color:var(--ink-faint); margin:0;}
.chevron{font-size:12px; color:var(--ink-faint); transition:transform .2s;}
.cat-card.open .chevron{transform:rotate(180deg);}
.cat-body{max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:1px solid transparent;}
.cat-card.open .cat-body{border-top:1px solid var(--card-border);}
.cat-body-inner{padding:20px;}

.sim-formula{
  background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px;
  padding:14px 16px; font-size:15px; text-align:center; margin:14px 0; color:var(--chalk-yellow);
}

/* measurement simulators (Sissejuhatus füüsikasse), card background echoes the
   hero/category starfield feel (soft dark gradient + faint colored glows),
   but with its own angle and glow placement so it isn't a copy-paste. */
.msim-block{
  margin-bottom:28px;
  padding:18px;
  border:1px solid var(--card-border);
  border-radius:10px;
  background:linear-gradient(200deg, rgba(20,31,42,0.82) 0%, rgba(16,25,34,0.55) 55%, rgba(15,23,32,0.3) 100%);
  position:relative;
  overflow:hidden;
}
.msim-block::before{
  content:"";
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 14% 18%, rgba(242,201,76,0.09), transparent 34%),
    radial-gradient(circle at 85% 82%, rgba(95,180,162,0.10), transparent 30%);
}
.msim-block > *{position:relative; z-index:1;}
.msim-block:last-child{margin-bottom:0;}
.msim-block h5{font-size:13.5px; font-weight:700; margin:0 0 12px; color:var(--ink);}
.kin-formula-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.kin-formula-card{padding:12px; border:1px solid var(--card-border); border-radius:8px; background:var(--bg-alt);}
.kin-formula-card span{display:block; color:var(--ink-faint); font:11px 'Space Mono',monospace; margin-bottom:5px;}
.kin-formula-card .sim-formula{margin:0; padding:8px; font-size:14px;}
@media(max-width:560px){.kin-formula-grid{grid-template-columns:1fr;}}

/* Kinemaatika simulatsiooni stiilid */
#stage{width:100%; height:180px; display:block; background:var(--bg-alt); border-radius:8px; border:1px solid var(--card-border);}
#graph{width:100%; height:150px; display:block; background:var(--bg-alt); border-radius:8px; border:1px solid var(--card-border); margin-top:14px;}
.sim-controls{margin-top:18px; display:flex; flex-direction:column; gap:14px;}
.ctrl-row{display:flex; align-items:center; gap:12px; font-size:13px;}
.ctrl-row label{width:118px; color:var(--ink-dim); flex-shrink:0;}
.ctrl-row input[type=range]{flex:1; accent-color:var(--teal);}
.ctrl-row .val{width:80px; text-align:right; color:var(--teal); font-family:'Space Mono',monospace; font-size:12.5px;}
.btn-row{display:flex; gap:10px; margin-top:6px;}
.readouts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.readout{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:10px 12px;}
.readout .k{font-size:11px; color:var(--ink-faint); font-family:'Space Mono',monospace; letter-spacing:0.3px;}
.readout .v{font-size:16px; color:var(--chalk-yellow); font-family:'Space Mono',monospace; margin-top:3px;}
.readout .v small{color:var(--ink-faint); font-size:11px; margin-left:3px;}
.formula-group{margin-bottom:20px;}
.formula-group:last-child{margin-bottom:0;}
.formula-group h4{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px;}
.formula-card{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.formula-card:last-child{margin-bottom:0;}
.formula-card .expr{font-family:'Space Mono',monospace; color:var(--chalk-yellow);}
.formula-card .live{font-family:'Space Mono',monospace; color:var(--teal); font-size:13px;}
.sim-layout{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:14px;}
@media(max-width:860px){.sim-layout{grid-template-columns:1fr;}}

.explain-item{border-bottom:1px solid var(--card-border); padding:12px 0;}
.explain-item:last-child{border-bottom:none;}
.explain-item summary{cursor:pointer; font-size:13.5px; font-weight:700; list-style:none; display:flex; justify-content:space-between;}
.explain-item summary::-webkit-details-marker{display:none;}
.explain-item p{font-size:14px; line-height:1.7; color:var(--ink-dim); margin:10px 0 0; font-family:'Literata',serif;}

.video-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media(max-width:500px){.video-grid{grid-template-columns:1fr;}}
.video-item{background:var(--bg-alt); border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid var(--card-border);}
.video-thumb{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative; background:linear-gradient(135deg, rgba(224,138,107,0.12), rgba(224,138,107,0.03));}
.play-btn{width:36px; height:36px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; color:#1a1408; font-size:13px;}
.video-item .vlabel{padding:10px 12px; font-size:12px; color:var(--ink-dim);}

.ex-item{border:1px solid var(--card-border); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
.ex-item:last-child{margin-bottom:0;}
.ex-q{font-size:13.5px; margin:0 0 10px;}
.ex-row{display:flex; gap:8px;}
.ex-row input[type=text]{
  flex:1; background:var(--bg-alt); border:1px solid var(--card-border); border-radius:6px;
  color:var(--ink); padding:8px 10px; font-size:13px; font-family:'Space Mono',monospace;
}
.ex-row button{font-size:12px; padding:8px 14px;}
.ex-feedback{font-size:12px; margin-top:8px; display:none;}
.ex-feedback.correct{color:var(--teal); display:block;}
.ex-feedback.wrong{color:var(--coral); display:block;}

footer{padding:40px 24px; border-top:1px solid var(--card-border); text-align:center; font-size:11.5px; color:var(--ink-faint);}
</style>
</head>
<body>

<section class="section wrap" id="detail-view">
  <button class="back-link" onclick="window.location.href='index.html'">← kõik teemad</button>
  <h2 class="detail-title" id="detail-title"></h2>
  <p class="detail-sub" id="detail-sub"></p>
  <div class="cat-grid" id="cat-grid"></div>
</section>

<section class="section wrap" id="category-page">
  <canvas id="category-field" aria-hidden="true"></canvas>
  <div class="category-field-scrim" aria-hidden="true"></div>
  <button class="back-link" id="cat-back-link">← tagasi teema juurde</button>
  <div class="cat-page-eyebrow" id="cat-page-eyebrow"></div>
  <h2 class="detail-title" id="cat-page-title"></h2>
  <p class="detail-sub" id="cat-page-sub"></p>
  <div id="cat-page-content"></div>
</section>

<script>
const topics = [
  {name:"Kinemaatika", tag:"Kiirus, kiirendus, graafikud", icon:"→", lessons:12,
    videos:[
      {title:'Sissejuhatus: ühtlaselt kiirenev liikumine (ingliskeelne)', url:'https://www.youtube.com/watch?v=I-w7x-CCi-c'},
      {title:'Näidisülesanne: viltu heidetud keha liikumine (ingliskeelne)', url:'https://www.youtube.com/watch?v=ZZ39o1rAZWY'},
      {title:'Vabalangemise kiirenduse g mõõtmine (ingliskeelne)', url:'https://www.youtube.com/watch?v=esfy8_u01KA'},
      {title:'Langevarjuhüppaja vabalangemine ja lõppkiirus (ingliskeelne)', url:'https://www.youtube.com/watch?v=epVnGpmAi5U'},
      {title:'Ülesannete lahendamine (eesti keeles)', url:'https://www.youtube.com/watch?v=cYjlHv_gh58'},
      {title:'Ülesannete lahendamine (eesti keeles)', url:'https://www.youtube.com/watch?v=K7uLg8RPi4E'},
      {title:'Ülesannete lahendamine (eesti keeles)', url:'https://www.youtube.com/watch?v=OXF3EUwXfjc'}
    ],
    exercises:[
      {q:'Paadi kiirus vees on 3 m/s, jõe laius 90 m, voolu kiirus 1,5 m/s. Paat sõuab kogu aeg risti vooluga. Mitu meetrit kannab vool paati allavoolu?', a:'45'},
      {q:'Ujuja kiirus vees on 0,8 m/s, voolu kiirus 0,6 m/s, jõe laius 40 m. Ujuja hoiab suuna risti vooluga. Mitme meetri võrra kannab vool teda allavoolu?', a:'30'},
      {q:'Jõe laius on 48 m. Ujuja kiirus vee suhtes on 1,0 m/s ja voolu kiirus 0,6 m/s. Kui kaua kulub ujujal vastaskaldale jõudmiseks lühimat teed pidi (s)?', a:'60'},
      {q:'Kanali laius on 96 m. Purjeka kiirus vee suhtes on 1,7 m/s ja voolu kiirus 1,5 m/s. Kui kaua kulub purjetajal vastaskaldale jõudmiseks lühimat teed pidi (s)?', a:'120'},
      {q:'Praam sõidab jõel kahe kaldapunkti vahel, mille vahemaa on 40 km. Pärivoolu kulub praamil 2 tundi, vastuvoolu 4 tundi. Leia praami kiirus seisvas vees (km/h).', a:'15'},
      {q:'Auto kiirus kasvab 2 sekundiga 5 m/s-lt 15 m/s-le ühtlaselt kiireneva liikumisega. Leia auto kiirendus (m/s²).', a:'5'},
      {q:'Auto alustab paigalt (v₀ = 0) ja kiirendab kiirendusega 4 m/s². Kui pika tee läbib ta 3 sekundiga?', a:'18'},
      {q:'Ratturi algkiirus on 2 m/s ja ta kiirendab kiirendusega 1,5 m/s² 4 sekundi jooksul. Milline on tema lõppkiirus (m/s)?', a:'8'},
      {q:'Kivi kukub vabalt seisuasendist (v₀ = 0) ja läbib kukkudes kõrguse 45 m. Kui kaua kestab kukkumine, kui g = 10 m/s²?', a:'3'},
      {q:'Auto kiirus kasvab algkiiruselt 4 m/s lõppkiiruseni 12 m/s teepikkusel 32 m. Leia auto kiirendus (m/s²).', a:'2'}
    ],
    formulaHTML:`
      <div class="msim-block"><h5>Kinemaatika põhivalemid</h5>
        <div class="kin-formula-grid">
          <div class="kin-formula-card"><span>Kiirus</span><div class="sim-formula">v = Δs / Δt</div></div><div class="kin-formula-card"><span>Kiirendus</span><div class="sim-formula">a = (v − v₀) / t</div></div>
          <div class="kin-formula-card"><span>Keskmine kiirus</span><div class="sim-formula">vₖ = sₖ / tₖ</div></div><div class="kin-formula-card"><span>Lõppkiirus</span><div class="sim-formula">v = v₀ + at</div></div>
          <div class="kin-formula-card"><span>Ühtlane liikumine</span><div class="sim-formula">x = x₀ + vt</div></div><div class="kin-formula-card"><span>Teepikkus</span><div class="sim-formula">s = v₀t + at² / 2</div></div>
          <div class="kin-formula-card"><span>Koordinaat</span><div class="sim-formula">x = x₀ + v₀t + at² / 2</div></div><div class="kin-formula-card"><span>Kiiruse ja teepikkuse seos</span><div class="sim-formula">s = (v² − v₀²) / 2a</div></div>
          <div class="kin-formula-card"><span>Raskuskiirendus</span><div class="sim-formula">g = 9,81 m/s²</div></div><div class="kin-formula-card"><span>Vabalangemine</span><div class="sim-formula">h = v₀t + gt² / 2</div></div>
          <div class="kin-formula-card"><span>Kõrgus kiiruste kaudu</span><div class="sim-formula">h = (v² − v₀²) / 2g</div></div><div class="kin-formula-card"><span>Kiirendus raskusväljas</span><div class="sim-formula">g = (v − v₀) / t</div></div>
        </div>
      </div>
      <div class="msim-block"><h5>Kiireneva auto simulatsioon</h5>
        <p style="font-size:13px; color:var(--ink-dim); margin:0 0 14px; font-family:'Literata',serif;">Muuda algkiirust ja kiirendust ning jälgi, kuidas auto sõidab mööda teed ja kuidas selle kiirus ajas muutub.</p>
        <div class="sim-layout">
          <div>
            <canvas id="stage"></canvas>
            <canvas id="graph"></canvas>

            <div class="sim-controls">
              <div class="ctrl-row">
                <label>algkiirus v₀</label>
                <input type="range" id="ctrl-v0" min="0" max="15" step="0.5" value="2">
                <span class="val" id="ctrl-v0-out">2.0 m/s</span>
              </div>
              <div class="ctrl-row">
                <label>kiirendus a</label>
                <input type="range" id="ctrl-a" min="-3" max="4" step="0.1" value="1.2">
                <span class="val" id="ctrl-a-out">1.2 m/s²</span>
              </div>
              <div class="btn-row">
                <button class="btn primary" id="btn-play">Peata</button>
                <button class="btn" id="btn-reset">Lähtesta</button>
              </div>
            </div>

            <div class="readouts">
              <div class="readout"><div class="k">t (aeg)</div><div class="v" id="ro-t">0.0<small>s</small></div></div>
              <div class="readout"><div class="k">v (kiirus)</div><div class="v" id="ro-v">0.0<small>m/s</small></div></div>
              <div class="readout"><div class="k">s (teepikkus)</div><div class="v" id="ro-s">0.0<small>m</small></div></div>
              <div class="readout"><div class="k">Δv : Δt (kontroll)</div><div class="v" id="ro-a">0.0<small>m/s²</small></div></div>
            </div>
          </div>

          <div>
            <div class="formula-group">
              <h4>Kiirus ja teepikkus</h4>
              <div class="formula-card"><span class="expr">v = v₀ + at</span><span class="live" id="fv-1"></span></div>
              <div class="formula-card"><span class="expr">s = v₀t + at² : 2</span><span class="live" id="fv-2"></span></div>
              <div class="formula-card"><span class="expr">a = Δv : Δt</span><span class="live" id="fv-3"></span></div>
            </div>
            <div class="formula-group">
              <h4>Erijuht: paigalseisust (v₀ = 0)</h4>
              <div class="formula-card"><span class="expr">v = at</span><span class="live"></span></div>
              <div class="formula-card"><span class="expr">s = at² : 2</span><span class="live"></span></div>
            </div>
          </div>
        </div>
      </div>
    `,
    explain:`
      <details class="explain-item" open><summary>1. Liikumise kirjeldamine <span>+</span></summary><p>Kinemaatika on mehaanika osa, mis kirjeldab kehade liikumist: asukohta, teepikkust, aega, kiirust ja kiirendust. See kirjeldab, <em>kuidas</em> keha liigub; liikumise põhjustega tegeleb dünaamika. Trajektoor on joon, mida mööda keha liigub. Kui keha mõõtmed pole ülesandes olulised, võib seda käsitleda punktmassina. Liikumist kirjeldatakse alati valitud taustsüsteemi suhtes.</p></details>
      <details class="explain-item"><summary>2. Teepikkus, aeg ja kiirus <span>+</span></summary><p>Teepikkus s näitab läbitud tee pikkust, aeg t liikumise kestust ja kiirus v liikumise kiirust. Ühtlase liikumise korral: <b>v = s / t</b>, seega <b>s = vt</b> ja <b>t = s / v</b>. Kiiruse SI-ühik on m/s. Ka km/h on kasutatav, kuid arvutuses peavad ühikud sobima. Teisendus: <b>1 m/s = 3,6 km/h</b>; näiteks 10 m/s = 36 km/h.</p></details>
      <details class="explain-item"><summary>3. Ühtlane liikumine <span>+</span></summary><p>Ühtlasel liikumisel läbib keha võrdsetes ajavahemikes võrdsed teepikkused ja kiirus ei muutu. Kui liikumist kirjeldatakse x-teljel, siis <b>x = x₀ + vt</b>, kus x on koordinaat, x₀ algkoordinaat, v kiirus ja t aeg. Kiirus võib olla negatiivne: see näitab liikumist x-telje negatiivses suunas.</p></details>
      <details class="explain-item"><summary>4. Keskmine kiirus <span>+</span></summary><p>Tegelik liikumine ei ole tavaliselt kogu aeg ühtlane. Keskmine kiirus leitakse kogu läbitud teepikkuse ja kogu kulunud aja järgi: <b>vₖ = s / t</b>. See ei ole üldjuhul eri kiiruste aritmeetiline keskmine. Esmalt leia kogu teepikkus ja kogu aeg, seejärel jaga need omavahel.</p></details>
      <details class="explain-item"><summary>5. Mitteühtlane liikumine ja kiirendus <span>+</span></summary><p>Kui kiirus muutub, on liikumine mitteühtlane. Kiirendus a näitab kiiruse muutust ajaühikus: <b>a = Δv / Δt = (v₂ − v₁) / t</b>. Kiirenduse SI-ühik on m/s². Kiiruse kasvamisel on liikumine kiirenev, vähenemisel aeglustuv.</p></details>
      <details class="explain-item"><summary>6. Ühtlaselt muutuv liikumine <span>+</span></summary><p>Ühtlaselt muutuval liikumisel on kiirendus konstantne. Põhivalemid on <b>v = v₀ + at</b> ja <b>s = v₀t + at² / 2</b>. Kui keha alustab paigalseisust (v₀ = 0), lihtsustuvad need kujule <b>v = at</b> ning <b>s = at² / 2</b>.</p></details>
      <details class="explain-item"><summary>7. Kinemaatika graafikud <span>+</span></summary><p>Graafikud näitavad suuruste muutumist ajas. Ühtlase liikumise korral on x(t)-graafik sirge ning selle tõus näitab kiirust. v(t)-graafik on ühtlasel liikumisel horisontaalne sirge; ühtlaselt muutuval liikumisel on see sirge, mille tõus näitab kiirendust. Konstantse kiirenduse korral on a(t)-graafik horisontaalne sirge.</p></details>
      <details class="explain-item"><summary>8. Kokkuvõte <span>+</span></summary><p>Kinemaatika kirjeldab kehade liikumist asukoha, teepikkuse, aja, kiiruse ja kiirenduse abil. Ühtlasel liikumisel on kiirus püsiv, ühtlaselt muutuval liikumisel on püsiv kiirendus. Liikumist saab arvutada valemite ja tõlgendada x(t), v(t) ning a(t) graafikute abil.</p></details>
      <details class="explain-item"><summary>9. Levinud vead <span>+</span></summary><p>Kontrolli alati ühikuid: näiteks m/s ja tunnid ei sobi samasse arvutusse ilma teisendamiseta. Keskmise kiiruse leidmisel ära arvuta eri kiiruste lihtsat aritmeetilist keskmist. Kasuta kogu teepikkust ja kogu aega. Ära aja segi kiirust ja kiirendust ning pea meeles, et negatiivne kiirus näitab liikumissuunda, mitte tingimata aeglustumist.</p></details>
      <details class="explain-item"><summary>10. Mõisted <span>+</span></summary><p><b>Kinemaatika</b> – mehaanika osa, mis kirjeldab kehade liikumist.<br><b>Punktmass</b> – keha, mille mõõtmed võib ülesandes arvestamata jätta.<br><b>Trajektoor</b> – joon, mida mööda keha liigub.<br><b>Teepikkus s</b> – keha läbitud tee pikkus.<br><b>Aeg t</b> – liikumise kestus.<br><b>Kiirus v</b> – suurus, mis kirjeldab keha liikumise kiirust ja suunda.<br><b>Keskmine kiirus</b> – kogu läbitud teepikkuse ja kogu liikumisaja suhe.<br><b>Kiirendus a</b> – suurus, mis kirjeldab kiiruse muutumist aja jooksul.<br><b>Ühtlane liikumine</b> – liikumine, mille korral kiirus ei muutu.<br><b>Ühtlaselt muutuv liikumine</b> – liikumine, mille korral kiirendus on konstantne.<br><b>Algkiirus v₀</b> – keha kiirus liikumise alghetkel.<br><b>Koordinaat x</b> – suurus, millega määratakse keha asukoht valitud koordinaatteljel.<br><b>Algkoordinaat x₀</b> – keha koordinaat ajahetkel t = 0.<br><b>Kiirenev liikumine</b> – liikumine, mille korral keha kiirus suureneb.<br><b>Aeglustuv liikumine</b> – liikumine, mille korral keha kiirus väheneb.</p></details>
    `}
];

function initCarSimulation(){
  const stage = document.getElementById('stage');
  if(!stage) return;
  const sctx = stage.getContext('2d');
  const graph = document.getElementById('graph');
  const gctx = graph.getContext('2d');

  const v0Slider = document.getElementById('ctrl-v0');
  const aSlider = document.getElementById('ctrl-a');
  const v0Out = document.getElementById('ctrl-v0-out');
  const aOut = document.getElementById('ctrl-a-out');
  const playBtn = document.getElementById('btn-play');
  const resetBtn = document.getElementById('btn-reset');

  let v0 = parseFloat(v0Slider.value);
  let a = parseFloat(aSlider.value);
  let t = 0, s = 0, v = v0;
  let running = true, lastTs = null;
  let history = []; // {t, v}

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1,2);
    [ [stage,sctx], [graph,gctx] ].forEach(([c,x])=>{
      const w = c.clientWidth, h = c.clientHeight;
      c.width = w*dpr; c.height = h*dpr;
      x.setTransform(dpr,0,0,dpr,0,0);
    });
  }
  window.addEventListener('resize', resize);
  resize();

  v0Slider.addEventListener('input', ()=>{ v0 = parseFloat(v0Slider.value); v0Out.textContent = v0.toFixed(1)+' m/s'; });
  aSlider.addEventListener('input', ()=>{ a = parseFloat(aSlider.value); aOut.textContent = a.toFixed(1)+' m/s²'; });
  v0Out.textContent = v0.toFixed(1)+' m/s';
  aOut.textContent = a.toFixed(1)+' m/s²';

  playBtn.addEventListener('click', ()=>{ running=!running; playBtn.textContent = running?'Peata':'Jätka'; lastTs=null; });
  resetBtn.addEventListener('click', ()=>{ t=0; s=0; v=v0; history=[]; lastTs=null; });

  function fmt(n,d=2){ return isFinite(n)? n.toFixed(d) : '—'; }

  function drawCar(x, laneY, h){
    sctx.save();
    sctx.translate(x, laneY);
    // body
    sctx.fillStyle = '#e08a6b';
    sctx.beginPath();
    sctx.moveTo(-26,10);
    sctx.lineTo(-20,-6);
    sctx.lineTo(-8,-14);
    sctx.lineTo(14,-14);
    sctx.lineTo(24,-4);
    sctx.lineTo(26,10);
    sctx.closePath();
    sctx.fill();
    // windows
    sctx.fillStyle = '#16212c';
    sctx.beginPath();
    sctx.moveTo(-14,-6);
    sctx.lineTo(-8,-12);
    sctx.lineTo(10,-12);
    sctx.lineTo(14,-6);
    sctx.closePath();
    sctx.fill();
    // wheels
    sctx.fillStyle = '#0f1720';
    sctx.beginPath(); sctx.arc(-14,12,6,0,Math.PI*2); sctx.fill();
    sctx.beginPath(); sctx.arc(14,12,6,0,Math.PI*2); sctx.fill();
    sctx.fillStyle = '#6d7684';
    sctx.beginPath(); sctx.arc(-14,12,2.4,0,Math.PI*2); sctx.fill();
    sctx.beginPath(); sctx.arc(14,12,2.4,0,Math.PI*2); sctx.fill();
    sctx.restore();
  }

  function drawStage(){
    const w = stage.clientWidth, h = stage.clientHeight;
    sctx.clearRect(0,0,w,h);
    const laneY = h*0.62;

    // road
    sctx.fillStyle = 'rgba(237,234,224,0.05)';
    sctx.fillRect(0, laneY+16, w, h-(laneY+16));
    sctx.strokeStyle = 'rgba(237,234,224,0.18)';
    sctx.setLineDash([10,10]);
    sctx.beginPath();
    sctx.moveTo(0, laneY+16); sctx.lineTo(w, laneY+16);
    sctx.stroke();
    sctx.setLineDash([]);

    // distance markers every 20m, scrolling with s
    const pxPerM = 8;
    const offset = (s*pxPerM) % 80;
    sctx.fillStyle = 'rgba(237,234,224,0.35)';
    sctx.font = '10px "Space Mono", monospace';
    for(let i=-1; i<Math.ceil(w/80)+1; i++){
      const mx = i*80 - offset;
      sctx.fillRect(mx, laneY+40, 2, 10);
      const meters = Math.round((i*80 - offset + s*pxPerM)/pxPerM/10)*10;
    }

    drawCar(w*0.28, laneY, h);

    // speed trail behind car proportional to v
    const trail = Math.min(60, Math.max(0, v*4));
    const grad = sctx.createLinearGradient(w*0.28-30-trail, laneY, w*0.28-30, laneY);
    grad.addColorStop(0, 'rgba(242,201,76,0)');
    grad.addColorStop(1, 'rgba(242,201,76,0.5)');
    sctx.fillStyle = grad;
    sctx.fillRect(w*0.28-30-trail, laneY-3, trail, 6);
  }

  function drawGraph(){
    const w = graph.clientWidth, h = graph.clientHeight;
    gctx.clearRect(0,0,w,h);
    gctx.strokeStyle = 'rgba(237,234,224,0.1)';
    gctx.lineWidth = 1;
    gctx.beginPath(); gctx.moveTo(30,10); gctx.lineTo(30,h-20); gctx.lineTo(w-10,h-20); gctx.stroke();
    gctx.fillStyle = 'var(--ink-faint)';
    gctx.fillStyle = 'rgba(170,178,189,0.8)';
    gctx.font = '10px "Space Mono", monospace';
    gctx.fillText('v (m/s)', 4, 12);
    gctx.fillText('t (s)', w-30, h-6);

    if(history.length < 2) return;
    const maxT = Math.max(8, history[history.length-1].t);
    const vs = history.map(p=>p.v);
    const maxV = Math.max(5, ...vs, -Math.min(0,...vs));
    const minV = Math.min(0, ...vs);
    const xOf = (tt)=> 30 + (tt/maxT)*(w-40);
    const yOf = (vv)=> (h-20) - ((vv-minV)/(maxV-minV))*(h-30);

    gctx.strokeStyle = '#f2c94c';
    gctx.lineWidth = 2;
    gctx.beginPath();
    history.forEach((p,i)=>{
      const x = xOf(p.t), y = yOf(p.v);
      if(i===0) gctx.moveTo(x,y); else gctx.lineTo(x,y);
    });
    gctx.stroke();

    // zero line
    gctx.strokeStyle = 'rgba(237,234,224,0.15)';
    gctx.setLineDash([3,4]);
    gctx.beginPath(); gctx.moveTo(30, yOf(0)); gctx.lineTo(w-10, yOf(0)); gctx.stroke();
    gctx.setLineDash([]);
  }

  function step(ts){
    if(lastTs===null) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;

    if(running){
      t += dt;
      v = v0 + a*t;
      s = v0*t + 0.5*a*t*t;
      if(s < 0){ s = 0; v = Math.max(v,0); }
      history.push({t, v});
      if(history.length > 600) history.shift();
      if(t > 40){ t=0; s=0; v=v0; history=[]; }
    }

    drawStage();
    drawGraph();

    document.getElementById('ro-t').innerHTML = fmt(t,1)+'<small>s</small>';
    document.getElementById('ro-v').innerHTML = fmt(v,2)+'<small>m/s</small>';
    document.getElementById('ro-s').innerHTML = fmt(s,2)+'<small>m</small>';
    document.getElementById('ro-a').innerHTML = fmt(a,2)+'<small>m/s²</small>';
    document.getElementById('fv-1').textContent = `v = ${fmt(v,2)} m/s`;
    document.getElementById('fv-2').textContent = `s = ${fmt(s,2)} m`;
    document.getElementById('fv-3').textContent = `a = ${fmt(a,2)} m/s²`;

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

(function(){
  const canvas = document.getElementById('field-canvas');
  const ctx = canvas.getContext('2d');
  const hero = document.querySelector('.hero');
  let w, h;

  function resize(){
    w = canvas.width = hero.clientWidth;
    h = canvas.height = hero.clientHeight;
  }

  resize();
  window.addEventListener('resize', resize);

  const mouse = {x:-9999, y:-9999};
  hero.addEventListener('mousemove', e=>{
    const r = hero.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  hero.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });

  let stars, shootingStars = [], shootTimer = 0;

  function moonPos(){
    return {mx: w-64, my: 60, mr: 27};
  }

  function initStars(){
    const count = Math.max(40, Math.floor((w*h)/9000));
    const {mx, my, mr} = moonPos();
    stars = Array.from({length:count}, ()=>{
      let x, y;
      do{
        x = Math.random()*w;
        y = Math.random()*h;
      } while(Math.hypot(x-mx, y-my) < mr+14);
      return {
        x, y,
        r: 0.6 + Math.random()*1.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.015 + Math.random()*0.02
      };
    });
  }
  initStars();
  window.addEventListener('resize', initStars);

  function drawStars(){
    stars.forEach(s=>{
      s.phase += s.speed;
      const tw = 0.25 + (Math.sin(s.phase)+1)/2*0.55;
      const d = Math.hypot(mouse.x-s.x, mouse.y-s.y);
      const near = Math.max(0, 1-d/90);
      const brightness = Math.min(1, tw + near*0.9);
      ctx.fillStyle = `rgba(237,234,224,${brightness})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + near*1.4, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function maybeSpawnShootingStar(){
    shootTimer--;
    if(shootTimer <= 0){
      shootTimer = 55 + Math.random()*100;
      const fromLeft = Math.random() < 0.5;
      const y0 = Math.random()*h*0.5;
      shootingStars.push({
        x: fromLeft ? -20 : w+20,
        y: y0,
        vx: (fromLeft ? 1 : -1) * (3 + Math.random()*2),
        vy: 1.4 + Math.random()*1,
        life: 1
      });
    }
  }

  function drawShootingStars(){
    shootingStars.forEach(s=>{
      s.x += s.vx; s.y += s.vy; s.life -= 0.012;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx*12, s.y - s.vy*12);
      grad.addColorStop(0, `rgba(242,201,76,${0.85*s.life})`);
      grad.addColorStop(1, 'rgba(242,201,76,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.1;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*12, s.y - s.vy*12);
      ctx.stroke();
    });
    shootingStars = shootingStars.filter(s => s.life > 0 && s.x > -40 && s.x < w+40 && s.y < h+40);
  }

  const moonLayer = document.createElement('canvas');
  const moonCtx = moonLayer.getContext('2d');

  function drawMoon(){
    const {mx, my, mr} = moonPos();
    const size = mr*2 + 4;

    ctx.save();
    const glow = ctx.createRadialGradient(mx, my, mr*0.6, mx, my, mr*2.4);
    glow.addColorStop(0, 'rgba(237,234,224,0.14)');
    glow.addColorStop(1, 'rgba(237,234,224,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mx, my, mr*2.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    moonLayer.width = size;
    moonLayer.height = size;
    moonCtx.clearRect(0, 0, size, size);
    const lx = size/2, ly = size/2;

    moonCtx.beginPath();
    moonCtx.arc(lx, ly, mr, 0, Math.PI*2);
    moonCtx.fillStyle = 'rgba(237,234,224,0.7)';
    moonCtx.fill();

    moonCtx.globalCompositeOperation = 'destination-out';
    moonCtx.beginPath();
    moonCtx.arc(lx + mr*0.52, ly - mr*0.26, mr, 0, Math.PI*2);
    moonCtx.fillStyle = 'rgba(0,0,0,1)';
    moonCtx.fill();
    moonCtx.globalCompositeOperation = 'source-over';

    ctx.drawImage(moonLayer, mx - lx, my - ly);
  }

  function drawPlanet(){
    const px = w-64, py = 60, pr = 20;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(px, py, pr*2.1, pr*0.55, -0.35, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(95,180,162,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.fillStyle = '#16212c';
    ctx.fill();
    ctx.fillStyle = 'rgba(242,201,76,0.28)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(242,201,76,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function step(){
    ctx.clearRect(0,0,w,h);
    drawStars();
    drawMoon();
    maybeSpawnShootingStar();
    drawShootingStars();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

/* subtle animated physics field behind simulation pages */
(function(){
  const canvas=document.getElementById('category-field');
  if(!canvas) return;
  const section=document.getElementById('category-page');
  const ctx=canvas.getContext('2d');
  let w=1,h=1, particles=[], t=0;
  const mouse={x:-9999,y:-9999};
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    w=section.clientWidth; h=section.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr;
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(34,Math.floor(w*h/15000));
    particles=Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:.6+Math.random()*1.5,phase:Math.random()*Math.PI*2,
      speed:.006+Math.random()*.014,orbit:20+Math.random()*70
    }));
  }
  resize(); window.addEventListener('resize',resize);
  section.addEventListener('mousemove',e=>{const r=section.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  section.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;});
  function frame(){
    t+=.008; ctx.clearRect(0,0,w,h);
    // faint curved field lines
    ctx.save();
    for(let i=0;i<7;i++){
      const cx=w*(.12+i*.14), cy=h*(.18+Math.sin(t*.35+i)*.06), rx=90+i*34, ry=55+i*20;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,Math.sin(i)*.35,0,Math.PI*2);
      ctx.strokeStyle=`rgba(95,180,162,${.025+i*.004})`; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();
    // particles / measurement-like nodes
    particles.forEach(p=>{
      p.phase+=p.speed;
      const ox=Math.cos(p.phase)*p.orbit*.22, oy=Math.sin(p.phase)*p.orbit*.22;
      const x=p.x+ox, y=p.y+oy;
      const d=Math.hypot(mouse.x-x,mouse.y-y), near=Math.max(0,1-d/120);
      const a=.18+near*.65+.25*(Math.sin(p.phase*2)+1)/2;
      ctx.fillStyle=`rgba(242,201,76,${Math.min(.9,a)})`;
      ctx.beginPath();ctx.arc(x,y,p.r+near*1.8,0,Math.PI*2);ctx.fill();
      if(near>.05){ctx.strokeStyle=`rgba(95,180,162,${near*.25})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
