<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>perioodilised-liikumised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Literata:opsz,wght@18..72,400;18..72,500;18..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1720;
  --bg-alt:#141f2a;
  --grid-line:rgba(237,234,224,0.055);
  --ink:#edeae0;
  --ink-dim:#aab2bd;
  --ink-faint:#6d7684;
  --chalk-yellow:#f2c94c;
  --chalk-yellow-dim:#8a752f;
  --teal:#5fb4a2;
  --teal-dim:#355f57;
  --coral:#e08a6b;
  --card-bg:#16212c;
  --card-border:rgba(237,234,224,0.09);
  --radius:10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;}
html::-webkit-scrollbar{display:none;}
body{scrollbar-width:none; -ms-overflow-style:none;}
body::-webkit-scrollbar{display:none;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    var(--bg);
  color:var(--ink);
  font-family:'Literata', serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mono,nav,.tag,.eyebrow,button,.btn{font-family:'Space Mono', monospace;}
::selection{background:var(--chalk-yellow); color:#141f2a;}
a{color:inherit;}

a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--chalk-yellow); outline-offset:3px; border-radius:4px;
}

.wrap{max-width:min(1180px, 92vw); margin:0 auto; padding:0 24px;}

nav{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(8px);
  background:rgba(15,23,32,0.82);
  border-bottom:1px solid var(--card-border);
}
.nav-inner{
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 0;
}
.logo{display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:0.5px;}
.logo-dot{width:8px; height:8px; border-radius:50%; background:var(--chalk-yellow);}
.nav-links{display:flex; gap:28px; font-size:13px; color:var(--ink-dim);}
.nav-link{cursor:pointer; transition:color .15s;}
.nav-link:hover{color:var(--ink);}

.hero{padding:90px 24px 60px; position:relative; overflow:hidden;}
#field-canvas{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;}
.hero-scrim{position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 400px 280px at 30% 40%, rgba(15,23,32,0.82) 0%, rgba(15,23,32,0.55) 45%, rgba(15,23,32,0.1) 75%, rgba(15,23,32,0) 90%);}
.hero > *:not(#field-canvas):not(.hero-scrim){position:relative; z-index:1;}
.eyebrow{
  font-size:12px; color:var(--teal); letter-spacing:1.5px; text-transform:uppercase;
  display:flex; align-items:center; gap:10px; margin-bottom:22px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--teal);}
h1.headline{
  font-size:clamp(32px, 5.5vw, 52px); line-height:1.12; font-weight:700;
  margin:0 0 20px; max-width:680px; letter-spacing:-0.5px;
}
.headline em{font-style:normal; color:var(--chalk-yellow);}
.sub{font-size:17px; line-height:1.7; color:var(--ink-dim); max-width:480px; margin:0 0 32px;}
.hero-cta{display:flex; gap:14px; align-items:center;}
.btn{
  font-size:13px; padding:12px 20px; border-radius:6px; border:1px solid var(--card-border);
  background:transparent; color:var(--ink); cursor:pointer; letter-spacing:0.3px;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--ink-faint); background:rgba(237,234,224,0.04);}
.btn.primary{background:var(--chalk-yellow); color:#1a1408; border-color:var(--chalk-yellow); font-weight:700;}
.btn.primary:hover{background:#f6d876;}

.traj-wrap{margin-top:56px; border:1px solid var(--card-border); border-radius:12px; background:var(--card-bg); padding:20px 24px;}
.traj-tabs{display:flex; gap:8px; margin-bottom:16px;}
.traj-tab{
  font-family:'Space Mono', monospace; font-size:11.5px; padding:6px 12px; border-radius:6px;
  border:1px solid var(--card-border); background:transparent; color:var(--ink-faint); cursor:pointer;
  transition:all .15s;
}
.traj-tab:hover{color:var(--ink-dim); border-color:var(--ink-faint);}
.traj-tab.active{background:var(--chalk-yellow); color:#1a1408; border-color:var(--chalk-yellow); font-weight:700;}
.traj-view{display:none;}
.traj-view.active{display:block;}
.traj-readout{display:flex; gap:28px; font-size:12px; color:var(--ink-faint); margin-bottom:10px;}
.traj-readout b{color:var(--teal); font-weight:400;}
#traj-svg, #osc-svg, #circ-svg{width:100%; height:auto; display:block;}
.traj-path{fill:none; stroke:var(--ink-faint); stroke-width:1.5; stroke-dasharray:4 5;}
.traj-dot{fill:var(--chalk-yellow);}
.traj-axis{stroke:var(--card-border); stroke-width:1;}

.section{padding:64px 24px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:8px;}
.section-head h2{font-size:20px; font-weight:700; margin:0;}
.section-head .count{font-size:12px; color:var(--ink-faint);}

.topics{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; perspective:900px;}
@media(max-width:720px){.topics{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){.topics{grid-template-columns:1fr;}}
.topic-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:20px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .15s ease-out, border-color .18s ease;
  transform-style:preserve-3d; will-change:transform;
}
.topic-card:hover{border-color:var(--ink-faint);}
.topic-card .num{
  position:absolute; top:14px; right:16px; font-size:11px; color:var(--ink-faint);
}
.topic-card .icon{font-size:22px; margin-bottom:14px; display:block;}
.topic-card h3{font-size:15px; font-weight:700; margin:0 0 6px; line-height:1.35;}
.topic-card p{font-size:12.5px; color:var(--ink-dim); margin:0; font-family:'Literata',serif; line-height:1.5;}
.topic-card .arrow{margin-top:14px; font-size:12px; color:var(--teal); display:flex; align-items:center; gap:5px;}

#detail-view{display:none;}
.back-link{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim);
  background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px;
}
.back-link:hover{color:var(--ink);}
.detail-title{font-size:26px; font-weight:700; margin:0 0 6px;}
.detail-sub{font-size:13px; color:var(--ink-faint); margin:0 0 32px;}

.cat-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;}
@media(max-width:600px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  overflow:hidden; transition:transform .18s ease, border-color .18s ease; cursor:pointer;
}
.cat-card:hover{transform:translateY(-3px); border-color:var(--ink-faint);}
.cat-head{
  padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
}
#category-page, #exercises-page, #about-page{display:none;}

#category-page{position:relative; overflow:hidden; isolation:isolate;}
#category-field{position:absolute; inset:0; width:100%; height:100%; z-index:-2; pointer-events:none;}
.category-field-scrim{position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse 620px 430px at 52% 38%, rgba(15,23,32,0.38) 0%, rgba(15,23,32,0.70) 58%, rgba(15,23,32,0.94) 100%);}
#category-page > *:not(#category-field):not(.category-field-scrim){position:relative; z-index:1;}

.cat-page-eyebrow{font-size:12px; color:var(--teal); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;}
.ex-topic-group{margin-bottom:28px;}
.ex-topic-group h4{font-size:14px; margin:0 0 10px; color:var(--ink-dim);}
.cat-head-left{display:flex; align-items:center; gap:12px;}
.cat-icon{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.cat-icon.formula{background:rgba(95,180,162,0.15); color:var(--teal);}
.cat-icon.text{background:rgba(242,201,76,0.15); color:var(--chalk-yellow);}
.cat-icon.video{background:rgba(224,138,107,0.15); color:var(--coral);}
.cat-icon.exercise{background:rgba(174,161,255,0.15); color:#b3a8ec;}
.cat-head h4{font-size:14.5px; font-weight:700; margin:0 0 2px;}
.cat-head p{font-size:11.5px; color:var(--ink-faint); margin:0;}
.chevron{font-size:12px; color:var(--ink-faint); transition:transform .2s;}
.cat-card.open .chevron{transform:rotate(180deg);}
.cat-body{max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:1px solid transparent;}
.cat-card.open .cat-body{border-top:1px solid var(--card-border);}
.cat-body-inner{padding:20px;}

.sim-row{display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:13px;}
.sim-row label{width:70px; color:var(--ink-dim); flex-shrink:0;}
.sim-row input[type=range]{flex:1; accent-color:var(--teal);}
.sim-row .val{width:60px; text-align:right; color:var(--teal);}
.sim-formula{
  background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px;
  padding:14px 16px; font-size:15px; text-align:center; margin:14px 0; color:var(--chalk-yellow);
}
canvas#sim-canvas{width:100%; height:140px; display:block; background:var(--bg-alt); border-radius:8px; margin-top:6px;}

/* formula reference grid (Kinemaatika-style card grid) */
.formula-ref-title{font-size:16px; font-weight:700; margin:0 0 16px; color:var(--ink);}
.formula-ref-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin-bottom:28px;}
@media(max-width:600px){.formula-ref-grid{grid-template-columns:1fr;}}
.formula-ref-card{border:1px solid var(--card-border); border-radius:10px; padding:16px; background:var(--card-bg);}
.formula-ref-label{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; font-family:'Space Mono',monospace;}
.formula-ref-box{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:14px 16px; text-align:center;}
.formula-ref-eq{font-family:'Space Mono',monospace; font-size:16px; color:var(--chalk-yellow);}

/* satellite sim integration styles */
.sat-layout{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:28px;}
@media(max-width:860px){.sat-layout{grid-template-columns:1fr;}}
.sat-panel{background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px;}
#sat-stage{width:100%; aspect-ratio:1/1; max-height:340px; display:block; background:var(--bg-alt); border-radius:8px; border:1px solid var(--card-border);}
.sat-controls{margin-top:18px; display:flex; flex-direction:column; gap:14px;}
.sat-ctrl-row{display:flex; align-items:center; gap:12px; font-size:13px;}
.sat-ctrl-row label{width:118px; color:var(--ink-dim); flex-shrink:0;}
.sat-ctrl-row input[type=range]{flex:1; accent-color:var(--teal);}
.sat-ctrl-row .val{width:90px; text-align:right; color:var(--teal); font-family:'Space Mono',monospace; font-size:12.5px;}
.sat-btn-row{display:flex; gap:10px; margin-top:6px;}
.sat-readouts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.sat-readout{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:10px 12px;}
.sat-readout .k{font-size:11px; color:var(--ink-faint); font-family:'Space Mono',monospace; letter-spacing:0.3px;}
.sat-readout .v{font-size:16px; color:var(--chalk-yellow); font-family:'Space Mono',monospace; margin-top:3px;}
.sat-readout .v small{color:var(--ink-faint); font-size:11px; margin-left:3px;}
.sat-formula-group{margin-bottom:20px;}
.sat-formula-group:last-child{margin-bottom:0;}
.sat-formula-group h4{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px;}
.sat-formula-card{background:var(--bg-alt); border:1px solid var(--card-border); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.sat-formula-card:last-child{margin-bottom:0;}
.sat-formula-card .expr{font-family:'Space Mono',monospace; color:var(--chalk-yellow);}
.sat-formula-card .live{font-family:'Space Mono',monospace; color:var(--teal); font-size:13px;}
.sat-note{margin-top:22px; font-size:12px; color:var(--ink-faint); line-height:1.6;}

/* measurement simulators (Sissejuhatus füüsikasse) — card background echoes the
   hero/category starfield feel (soft dark gradient + faint colored glows),
   but with its own angle and glow placement so it isn't a copy-paste. */
.msim-block{
  margin-bottom:28px;
  padding:18px;
  border:1px solid var(--card-border);
  border-radius:10px;
  background:linear-gradient(200deg, rgba(20,31,42,0.82) 0%, rgba(16,25,34,0.55) 55%, rgba(15,23,32,0.3) 100%);
  position:relative;
  overflow:hidden;
}
.msim-block::before{
  content:"";
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(circle at 14% 18%, rgba(242,201,76,0.09), transparent 34%),
    radial-gradient(circle at 85% 82%, rgba(95,180,162,0.10), transparent 30%);
}
.msim-block > *{position:relative; z-index:1;}
.msim-block:last-child{margin-bottom:0;}
.msim-block h5{font-size:13.5px; font-weight:700; margin:0 0 12px; color:var(--ink);}
.msim-result{font-size:14px; color:var(--teal); font-family:'Space Mono',monospace; margin:10px 0;}
.msim-scale{position:relative; height:64px; margin:20px 4px 6px;}
.msim-line{position:absolute; left:0; right:0; top:30px; height:5px; background:var(--card-border); border-radius:4px;}
.msim-range{position:absolute; top:20px; height:24px; border-radius:5px; background:rgba(95,180,162,0.3); border:1px solid rgba(95,180,162,0.5);}
.msim-marker{position:absolute; top:12px; width:2px; height:40px; background:var(--chalk-yellow);}
.msim-legend{display:flex; gap:20px; font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.msim-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; background:var(--chalk-yellow);}
.msim-dot.teal{background:rgba(95,180,162,0.6);}
.msim-barbox{display:flex; align-items:flex-end; gap:12px; height:120px; border-bottom:1px solid var(--card-border); padding:0 8px; margin-top:14px;}
.msim-bar{width:52px; border-radius:5px 5px 0 0; text-align:center; font-size:10.5px; padding-top:4px; color:#0f1720; font-weight:700; font-family:'Space Mono',monospace; transition:height .15s;}
.msim-bar.value{background:var(--teal);}
.msim-bar.error{background:var(--coral);}
.msim-measure-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; min-height:28px;}
.msim-measure{padding:5px 10px; border-radius:6px; background:var(--bg-alt); border:1px solid var(--card-border); font-size:11.5px; font-family:'Space Mono',monospace; color:var(--teal);}
.msim-note{font-size:12.5px; color:var(--ink-faint); margin-top:10px; line-height:1.6;}
.msim-btnrow{display:flex; gap:10px; margin-top:4px;}

.explain-item{border-bottom:1px solid var(--card-border); padding:12px 0;}
.explain-item:last-child{border-bottom:none;}
.explain-item summary{cursor:pointer; font-size:13.5px; font-weight:700; list-style:none; display:flex; justify-content:space-between;}
.explain-item summary::-webkit-details-marker{display:none;}
.explain-item p{font-size:14px; line-height:1.7; color:var(--ink-dim); margin:10px 0 0; font-family:'Literata',serif;}

.video-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media(max-width:500px){.video-grid{grid-template-columns:1fr;}}
.video-item{background:var(--bg-alt); border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid var(--card-border);}
.video-thumb{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative; background:linear-gradient(135deg, rgba(224,138,107,0.12), rgba(224,138,107,0.03));}
.play-btn{width:36px; height:36px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; color:#1a1408; font-size:13px;}
.video-item .vlabel{padding:10px 12px; font-size:12px; color:var(--ink-dim);}

.ex-item{border:1px solid var(--card-border); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
.ex-item:last-child{margin-bottom:0;}
.ex-q{font-size:13.5px; margin:0 0 10px;}
.ex-row{display:flex; gap:8px;}
.ex-row input[type=text]{
  flex:1; background:var(--bg-alt); border:1px solid var(--card-border); border-radius:6px;
  color:var(--ink); padding:8px 10px; font-size:13px; font-family:'Space Mono',monospace;
}
.ex-row button{font-size:12px; padding:8px 14px;}
.ex-feedback{font-size:12px; margin-top:8px; display:none;}
.ex-feedback.correct{color:var(--teal); display:block;}
.ex-feedback.wrong{color:var(--coral); display:block;}

footer{padding:40px 24px; border-top:1px solid var(--card-border); text-align:center; font-size:11.5px; color:var(--ink-faint);}
</style>
</head>
<body>

<section class="section wrap" id="detail-view">
  <button class="back-link" onclick="goHome()">← kõik teemad</button>
  <h2 class="detail-title" id="detail-title"></h2>
  <p class="detail-sub" id="detail-sub"></p>
  <div class="cat-grid" id="cat-grid"></div>
</section>

<section class="section wrap" id="category-page">
  <canvas id="category-field" aria-hidden="true"></canvas>
  <div class="category-field-scrim" aria-hidden="true"></div>
  <button class="back-link" id="cat-back-link">← tagasi teema juurde</button>
  <div class="cat-page-eyebrow" id="cat-page-eyebrow"></div>
  <h2 class="detail-title" id="cat-page-title"></h2>
  <p class="detail-sub" id="cat-page-sub"></p>
  <div id="cat-page-content"></div>
</section>

<script>
const topics = [
  {name:"Ringliikumine", tag:"pöörlemine ja tiirlemine", icon:"∿", lessons:7,
    formulaHTML:`
      <div class="formula-ref-title">Ringliikumise põhivalemid</div>
      <div class="formula-ref-grid">
        <div class="formula-ref-card">
          <div class="formula-ref-label">Joonkiirus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">v = l / t = C / T</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Nurkkiirus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">ω = φ / t = 2πf = 2π / T</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Pöördenurk</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">φ = l / r</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Periood</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">T = t / N = 1 / f</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Kraadid ja radiaanid</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">180° = π rad</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Sagedus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">f = N / t = 1 / T</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Ringjoone pikkus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">C = 2πr</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Joonkiirus nurkkiiruse kaudu</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">v = ωr</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Kesktõmbekiirendus</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">a = v² / r = ω²r</span></div>
        </div>
        <div class="formula-ref-card">
          <div class="formula-ref-label">Tehissatelliidi orbiit</div>
          <div class="formula-ref-box"><span class="formula-ref-eq">Interaktiivne simulatsioon</span></div>
        </div>
      </div>
      <p style="font-size:13.5px; color:var(--ink-dim); margin:0 0 16px; font-family:'Literata',serif; line-height:1.6;">Muuda orbiidi raadiust ja tiiruaega ning jälgi, kuidas satelliit ühtlase ringliikumisega Maa ümber tiirleb.</p>

      <div class="sat-layout">

    explain:`
      <details class="explain-item" open><summary>Perioodiline liikumine <span>+</span></summary>
        <p>Perioodiline liikumine on liikumine, mis kordub kindla ajavahemiku ehk perioodi järel. Selle näideteks on ringliikumine ja võnkliikumine. Perioodilist liikumist saab kirjeldada erinevate suuruste abil, näiteks teepikkuse, joonkiiruse, pöördenurga, nurkkiiruse, perioodi, sageduse, amplituudi ja hälbe abil.</p>
      </details>

      <details class="explain-item"><summary>Ringliikumine <span>+</span></summary>
        <p>Ringliikumine on liikumine, mille korral keha või keha punkti trajektoor on ringjoon või selle osa. Ringliikumisega on seotud pöörlemine ja tiirlemine.</p>
        <p>Pöörlemine on keha liikumine ümber seda keha läbiva paigalseisva telje. Näiteks pöörleb Maa ümber oma telje. Tiirlemine on keha liikumine kinnisel trajektooril, mille keskpunkt asub kehast väljaspool. Näiteks tiirleb Maa ümber Päikese.</p>
        <p>Ringliikumist kirjeldavad joonkiirus <b>v</b>, kõverusraadius <b>R</b>, pöördenurk <b>φ</b> ja nurkkiirus <b>ω</b>. Joonkiirus on ringjoone igas punktis suunatud mööda ringjoone puutujat.</p>
      </details>

      <details class="explain-item"><summary>Periood, sagedus ja kesktõmbekiirendus <span>+</span></summary>

        <p>Ringjoonel liikuva keha kiiruse suurus võib olla konstantne, kuid selle suund muutub pidevalt. Seda muutust kirjeldab kesktõmbekiirendus <b>a<sub>k</sub></b>, mis on suunatud ringjoone kõveruskeskpunkti poole ja on joonkiirusega risti.</p>
      </details>

      <details class="explain-item"><summary>Võnkliikumine <span>+</span></summary>
        <p>Võnkliikumine ehk võnkumine on liikumine, mis kordub võrdsete ajavahemike järel edasi-tagasi sama trajektoori mööda. Võnkumisel on olemas tasakaaluolek, mille poole süsteem püüab tagasi liikuda.</p>
        <p>Võnkumist kirjeldavad näiteks hälve <b>x</b> ja amplituud <b>A</b>. Hälve näitab keha kaugust tasakaaluasendist ning amplituud on keha suurim hälve tasakaaluasendist.</p>
        <p>Võnkumine võib olla vabavõnkumine või sundvõnkumine. Vabavõnkumine toimub süsteemisiseste jõudude mõjul ja võib aja jooksul sumbuda. Sundvõnkumine toimub välise perioodilise jõu mõjul.</p>
      </details>

      <details class="explain-item"><summary>Harmooniline võnkumine ja resonants <span>+</span></summary>
        <p>Harmoonilise võnkumise korral muutub hälve ajas siinuse või koosinuse seaduse järgi:</p>
        <div class="sim-formula" style="margin:10px 0;">x = x₀ sin(ωt)</div>
        <div class="sim-formula" style="margin:10px 0;">x = x₀ cos(ωt)</div>
        <p>Siin on <b>ω</b> nurkkiirus ning <b>φ = ωt</b> kirjeldab võnkumise faasi ehk võnkuva keha hetkeseisundit.</p>
        <p>Resonants toimub siis, kui välise perioodilise jõu sagedus ühtib süsteemi vabavõnkumise sagedusega. Selle tulemusena võib võnkeamplituud märgatavalt suureneda. Resonants võib olla nii kahjulik kui ka kasulik.</p>
      </details>

      <details class="explain-item"><summary>Lainetus <span>+</span></summary>
        <p>Lainetus on võnkumiste edasikandumine ruumis. Laine kannab edasi energiat, mitte ainet. Lained võivad olla ristlained, mille korral toimub võnkumine levimissuunaga risti, või pikilained, mille korral toimub võnkumine levimissuunas.</p>
        <p>Lainet saab kirjeldada näiteks lainepikkuse <b>λ</b> ja laine levimiskiiruse <b>v</b> abil. Lainepikkus on piki levimissuundu kahe samas taktis võnkuva punkti vaheline kaugus.</p>
      </details>

      <details class="explain-item"><summary>Põhimõisted <span>+</span></summary>
        <div style="display:flex; flex-direction:column; gap:10px; font-size:14px; line-height:1.6; color:var(--ink-dim);">
          <p style="margin:0;"><b style="color:var(--ink);">Perioodiline liikumine:</b> liikumine, mis kordub teatud ajavahemiku järel.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Trajektoor:</b> joon, mida mööda keha liigub.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Ringliikumine:</b> liikumine, mille korral keha punkti trajektoor on ringjoon või selle osa.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Pöörlemine:</b> keha liikumine ümber seda keha läbiva paigalseisva telje.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Tiirlemine:</b> keha liikumine kinnisel trajektooril, mille keskpunkt asub kehast väljaspool.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Periood (T):</b> aeg, mis kulub ühe täisringi või täisvõnke tegemiseks.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Sagedus (f):</b> ajaühikus tehtavate täisringide või täisvõngete arv.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Joonkiirus (v):</b> ringjoonel liikuva keha kiirus, mis on suunatud mööda ringjoone puutujat.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Nurkkiirus (ω):</b> suurus, mis kirjeldab pöördenurga muutumist ajas.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Kesktõmbekiirendus (a<sub>c</sub>):</b> kiirendus, mis on suunatud ringliikumise keskpunkti poole.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Võnkumine:</b> edasi-tagasi korduv liikumine sama trajektoori mööda.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Hälve (x):</b> võnkuva keha kaugus tasakaaluasendist.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Amplituud (A):</b> suurim hälve tasakaaluasendist.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Faas (φ):</b> suurus, mis kirjeldab võnkumise hetkeseisundit.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Vabavõnkumine:</b> võnkumine, mis toimub süsteemisiseste jõudude mõjul.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Sundvõnkumine:</b> võnkumine, mida põhjustab väline perioodiline jõud.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Resonants:</b> nähtus, mille korral välise mõju sageduse ühtimisel süsteemi vabavõnkumise sagedusega suureneb võnkeamplituud järsult.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Laine:</b> võnkumiste edasikandumine ruumis.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Ristlaine:</b> laine, milles võnkumine toimub levimissuunaga risti.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Pikilaine:</b> laine, milles võnkumine toimub levimissuunas.</p>
          <p style="margin:0;"><b style="color:var(--ink);">Lainepikkus (λ):</b> kahe samas taktis võnkuva punkti vaheline kaugus levimissuunas.</p>
        </div>
      </details>

      <details class="explain-item"><summary>Levinud vead <span>+</span></summary>
        <p><b>Perioodi ja sageduse segamini ajamine:</b> periood näitab ühe võnke tegemiseks kuluvat aega, sagedus näitab võngete arvu ajaühikus.</p>
        <p><b>Amplituudi ja hälbe segamini ajamine:</b> hälve muutub pidevalt, amplituud on selle maksimaalne väärtus.</p>
        <p><b>Pöörlemise ja tiirlemise segamini ajamine:</b> pöörlemisel liigub keha ümber oma telje, tiirlemisel liigub keha ümber kehast väljaspool asuva keskpunkti.</p>
        <p><b>Kesktõmbekiirenduse suuna unustamine:</b> see on suunatud alati ringi keskpunkti poole.</p>
        <p><b>Piki- ja ristlaine segamini ajamine:</b> tuleb vaadata võnkumise suunda võrreldes laine levimise suunaga.</p>
        <p><b>Resonantsi vale mõistmine:</b> resonants ei tähenda lihtsalt suurt võnkumist, vaid on seotud välise perioodilise mõju sageduse ühtimisega süsteemi vabavõnkumise sagedusega.</p>
      </details>

      <details class="explain-item"><summary>Lühike kokkuvõte <span>+</span></summary>
        <p>Perioodiline liikumine on liikumine, mis kordub kindla ajavahemiku järel. Selle kirjeldamisel on olulised periood ja sagedus. Perioodiliste liikumiste hulka kuuluvad näiteks ringliikumine ja võnkumine. Ringliikumisel muutub pidevalt liikumise suund ning võnkumisel liigub keha tasakaaluasendi ümber edasi-tagasi.</p>

const categories = [
  {key:'formula', icon:'ƒ', cls:'formula', title:'Valemid ja simulatsioonid', sub:'Interaktiivne arvutaja'},
  {key:'explain', icon:'§', cls:'text', title:'Selgitused', sub:'Teooria lühidalt'},
  {key:'video', icon:'▶', cls:'video', title:'Videod', sub:'Lühikesed videotunnid'},
  {key:'exercise', icon:'✓', cls:'exercise', title:'Ülesanded', sub:'Kontrolli oma teadmisi'}
];

let currentTopicIndex = 0;

function buildCategories(t){
  const catGrid = document.getElementById('cat-grid');
  catGrid.innerHTML = '';
  const hidden = t.hideCategories || [];
  categories.filter(c=>!hidden.includes(c.key)).forEach(c=>{
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `<div class="cat-head">
      <div class="cat-head-left"><div class="cat-icon ${c.cls}">${c.icon}</div><div><h4>${c.title}</h4><p>${c.sub}</p></div></div>
      <span class="chevron" style="transform:rotate(-90deg);">⌄</span>
    </div>`;
    card.addEventListener('click', ()=>openCategoryPage(currentTopicIndex, c.key));
    catGrid.appendChild(card);
  });
}

function openCategoryPage(topicIndex, catKey){
  currentTopicIndex = topicIndex;
  const t = topics[topicIndex];
  const cat = categories.find(c=>c.key===catKey);
  hideAllViews();
  document.getElementById('category-page').style.display = 'block';
  document.getElementById('cat-page-eyebrow').textContent = t.name;
  document.getElementById('cat-page-title').textContent = cat.title;
  document.getElementById('cat-page-sub').textContent = cat.sub;
  document.getElementById('cat-back-link').onclick = ()=>{ hideAllViews(); document.getElementById('detail-view').style.display='block'; window.scrollTo({top:0}); };

  const content = document.getElementById('cat-page-content');
  if(catKey==='formula'){
    if(t.formulaHTML){
      content.innerHTML = t.formulaHTML;
      if(t.formulaInit) t.formulaInit();
    } else {
      content.innerHTML = `
        <div class="sim-row"><label>kiirus v</label><input type="range" id="sim-v" min="1" max="30" value="10" oninput="runSim()"><span class="val" id="sim-v-out">10 m:s</span></div>
        <div class="sim-row"><label>aeg t</label><input type="range" id="sim-t" min="1" max="20" value="5" oninput="runSim()"><span class="val" id="sim-t-out">5 s</span></div>
        <div class="sim-formula" id="sim-formula">s = v · t = 50 m</div>
        <canvas id="sim-canvas"></canvas>
        <p style="font-size:13px; color:var(--ink-faint); margin-top:14px;">Liiguta liugureid ja jälgi, kuidas teekond s muutub ajas. Graafik joonistub reaalajas.</p>`;
      runSim();
    }
  } else if(catKey==='explain'){
    content.innerHTML = t.explain ? t.explain : `
      <details class="explain-item" open><summary>Mis on ${t.name.toLowerCase()}? <span>+</span></summary><p>Selles peatükis vaatame nähtust selle põhiomaduste kaudu ja seome selle igapäevaste näidetega, enne kui liigume valemite juurde.</p></details>
      <details class="explain-item"><summary>Peamised valemid <span>+</span></summary><p>Iga valem on tuletatud lihtsamatest suurustest ja seda saab valemite lehel ise katsetada.</p></details>
      <details class="explain-item"><summary>Levinud vead <span>+</span></summary><p>Tähelepanu tasub pöörata ühikutele ja märkidele, need on kõige sagedasem eksimuskoht kontrolltöödes.</p></details>
      <details class="explain-item"><summary>Kokkuvõte <span>+</span></summary><p>Enne järgmise tunni juurde minekut veendu, et suudad selgitada peamised mõisted oma sõnadega.</p></details>`;
  } else if(catKey==='video'){
    content.innerHTML = `<div class="video-grid" id="video-grid"></div>`;
    const vids = document.getElementById('video-grid');
    if(t.videos){
      t.videos.forEach(v=>{
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="video-thumb"><div class="play-btn">▶</div></div><div class="vlabel">${v.title}</div>`;
        item.addEventListener('click', ()=>window.open(v.url, '_blank'));
        vids.appendChild(item);
      });
    } else {
      ['Sissejuhatav loeng','Näidisülesanne koos lahenduskäiguga','Kordamine ja kokkuvõte'].forEach(v=>{
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="video-thumb"><div class="play-btn">▶</div></div><div class="vlabel">${v}</div>`;
        item.addEventListener('click', ()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(t.name+' füüsika'), '_blank'));
        vids.appendChild(item);
      });
    }
  } else if(catKey==='exercise'){
    content.innerHTML = `<div id="ex-list"></div>`;
    renderExerciseList(document.getElementById('ex-list'), t.exercises, 'p'+topicIndex+'-');
  }
  window.scrollTo({top:0});
}

function renderExerciseList(container, exercises, prefix){
  exercises.forEach((ex,i)=>{
    const item = document.createElement('div');
    item.className = 'ex-item';
    item.innerHTML = `<p class="ex-q">${i+1}. ${ex.q}</p>
      <div class="ex-row"><input type="text" placeholder="vastus" id="${prefix}ex-input-${i}"><button class="btn" onclick="checkEx('${prefix}', ${i}, '${ex.a}')">Kontrolli</button></div>
      <p class="ex-feedback" id="${prefix}ex-fb-${i}"></p>`;
    container.appendChild(item);
  });
}

function msimUpdate1(){
  const x = parseFloat(document.getElementById('msim-x').value);
  const e = parseFloat(document.getElementById('msim-e').value);

function runSim(){
  const v = parseFloat(document.getElementById('sim-v').value);
  const t = parseFloat(document.getElementById('sim-t').value);
  const s = Math.round(v*t);
  document.getElementById('sim-v-out').textContent = v + ' m:s';
  document.getElementById('sim-t-out').textContent = t + ' s';
  document.getElementById('sim-formula').textContent = `s = v · t = ${s} m`;

  const canvas = document.getElementById('sim-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.clientWidth || 300, h = 140;
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#5fb4a2';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const maxS = 30*20;
  for(let x=0; x<=w; x+=4){
    const tt = (x/w)*t;
    const ss = v*tt;
    const y = h-10 - (ss/maxS)*(h-20)*4;
    if(x===0) ctx.moveTo(x, Math.max(10,y)); else ctx.lineTo(x, Math.max(10,y));
  }
  ctx.stroke();
}

let satAnimFrame = null;
function initSatSim(){
  if(satAnimFrame) cancelAnimationFrame(satAnimFrame);
  const stage = document.getElementById('sat-stage');
  if(!stage) return;
  const ctx = stage.getContext('2d');

  const rSlider = document.getElementById('ctrl-r');
  const TSlider = document.getElementById('ctrl-T');
  const rOut = document.getElementById('ctrl-r-out');
  const TOut = document.getElementById('ctrl-T-out');
  const playBtn = document.getElementById('btn-play');
  const resetBtn = document.getElementById('btn-reset');

  let r = parseFloat(rSlider.value);
  let T = parseFloat(TSlider.value);
  let phi = 0, elapsed = 0, running = true, lastTs = null;

  let stars = [];
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = stage.clientWidth, h = stage.clientHeight;
    stage.width = w*dpr; stage.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.max(40, Math.floor((w*h)/2500));
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      r: 0.5+Math.random()*1.2, phase: Math.random()*Math.PI*2, speed: 0.01+Math.random()*0.02
    }));
  }
  resize();

  function syncOut(){
    rOut.textContent = r.toFixed(1)+' tuh. km'; TOut.textContent = T.toFixed(1)+' s';
  }
  rSlider.oninput = ()=>{ r=parseFloat(rSlider.value); syncOut(); };
  TSlider.oninput = ()=>{ T=parseFloat(TSlider.value); syncOut(); };
  syncOut();

  playBtn.onclick = ()=>{ running=!running; playBtn.textContent = running?'Peata':'Jätka'; lastTs=null; };
  resetBtn.onclick = ()=>{ phi=0; elapsed=0; lastTs=null; };

  function fmt(n,d=2){ return isFinite(n)? n.toFixed(d) : '—'; }

  function drawEarth(cx,cy,er){
    const grad = ctx.createRadialGradient(cx-er*0.3,cy-er*0.3,er*0.2, cx,cy,er);
    grad.addColorStop(0, '#7fc7c0');
    grad.addColorStop(0.5, '#3f8f8a');
    grad.addColorStop(1, '#1f5a58');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx,cy,er,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(95,180,162,0.35)';
    ctx.beginPath(); ctx.ellipse(cx-er*0.25, cy-er*0.15, er*0.4, er*0.22, 0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+er*0.3, cy+er*0.3, er*0.3, er*0.18, -0.3, 0, Math.PI*2); ctx.fill();
    const glow = ctx.createRadialGradient(cx,cy,er*0.9, cx,cy,er*1.5);
    glow.addColorStop(0, 'rgba(95,180,162,0.25)');
    glow.addColorStop(1, 'rgba(95,180,162,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx,cy,er*1.5,0,Math.PI*2); ctx.fill();
  }

  function drawSatellite(x,y,angle){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.fillStyle = '#edeae0';
    ctx.fillRect(-6,-4,12,8);
    ctx.fillStyle = 'rgba(95,180,162,0.85)';
    ctx.fillRect(-16,-2,8,4);
    ctx.fillRect(8,-2,8,4);
    ctx.strokeStyle = 'rgba(237,234,224,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-16,-2,8,4);
    ctx.strokeRect(8,-2,8,4);
    ctx.restore();
  }

  function draw(){
    const w = stage.clientWidth, h = stage.clientHeight;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2;

    stars.forEach(s=>{
      s.phase += s.speed;
      const tw = 0.3 + (Math.sin(s.phase)+1)/2*0.5;
      ctx.fillStyle = `rgba(237,234,224,${tw})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });

    const scale = Math.min(w,h)*0.44/6.2;
    const pr = r*scale;
    const earthR = Math.max(18, scale*0.9);

    ctx.strokeStyle = 'rgba(237,234,224,0.12)';
    ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.arc(cx,cy,pr,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    const trailLen = Math.PI*0.9;
    ctx.strokeStyle = 'rgba(95,180,162,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx,cy,pr, phi-trailLen, phi);
    ctx.stroke();

    drawEarth(cx,cy,earthR);

    const sx = cx + pr*Math.cos(phi);
    const sy = cy + pr*Math.sin(phi);
    drawSatellite(sx, sy, phi+Math.PI/2);

    const omega = (2*Math.PI)/T;
    const v = omega*r;
    const tx = -Math.sin(phi), ty = Math.cos(phi);
    const vecLen = Math.min(36, 10+v*10);
    const vx = sx + tx*vecLen, vy = sy + ty*vecLen;
    ctx.strokeStyle = '#f2c94c';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(vx,vy); ctx.stroke();
    const ah=6, angArrow=Math.atan2(vy-sy,vx-sx);
    ctx.beginPath();
    ctx.moveTo(vx,vy);
    ctx.lineTo(vx-ah*Math.cos(angArrow-0.4), vy-ah*Math.sin(angArrow-0.4));
    ctx.lineTo(vx-ah*Math.cos(angArrow+0.4), vy-ah*Math.sin(angArrow+0.4));
    ctx.closePath();
    ctx.fillStyle = '#f2c94c';
    ctx.fill();
  }

  function step(ts){
    if(lastTs===null) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;

    const omega = (2*Math.PI)/T;
    if(running){ phi += omega*dt; elapsed += dt; }

    draw();

    const f = 1/T;
    const v = omega*r;
    const a = omega*omega*r;
    const N = phi/(2*Math.PI);
    const C = 2*Math.PI*r;

    document.getElementById('ro-t').innerHTML = fmt(elapsed,1)+'<small>s</small>';
    document.getElementById('ro-N').textContent = fmt(N,2);
    document.getElementById('ro-omega').innerHTML = fmt(omega,2)+'<small>rad/s</small>';
    document.getElementById('ro-f').innerHTML = fmt(f,2)+'<small>Hz</small>';
    document.getElementById('ro-v').innerHTML = fmt(v,2)+'<small>ü</small>';
    document.getElementById('ro-a').innerHTML = fmt(a,2)+'<small>ü</small>';

    document.getElementById('fv-1').textContent = `ω = ${fmt(omega,2)} rad/s`;
    document.getElementById('fv-2').textContent = `f = ${fmt(f,2)} Hz`;
    document.getElementById('fv-3').textContent = `v = ${fmt(v,2)}`;
    document.getElementById('fv-4').textContent = `a = ${fmt(a,2)}`;
    document.getElementById('fv-5').textContent = `C = ${fmt(C,2)}`;

    satAnimFrame = requestAnimationFrame(step);
  }
  satAnimFrame = requestAnimationFrame(step);
}

(function(){
  const canvas = document.getElementById('field-canvas');
  const ctx = canvas.getContext('2d');
  const hero = document.querySelector('.hero');
  let w, h;

  function resize(){
    w = canvas.width = hero.clientWidth;
    h = canvas.height = hero.clientHeight;
  }

  resize();
  window.addEventListener('resize', resize);

  const mouse = {x:-9999, y:-9999};
  hero.addEventListener('mousemove', e=>{
    const r = hero.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  hero.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });

  let stars, shootingStars = [], shootTimer = 0;

  function moonPos(){
    return {mx: w-64, my: 60, mr: 27};
  }

  function initStars(){
    const count = Math.max(40, Math.floor((w*h)/9000));
    const {mx, my, mr} = moonPos();
    stars = Array.from({length:count}, ()=>{
      let x, y;
      do{
        x = Math.random()*w;
        y = Math.random()*h;
      } while(Math.hypot(x-mx, y-my) < mr+14);
      return {
        x, y,
        r: 0.6 + Math.random()*1.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.015 + Math.random()*0.02
      };
    });
  }
  initStars();
  window.addEventListener('resize', initStars);

  function drawStars(){
    stars.forEach(s=>{
      s.phase += s.speed;
      const tw = 0.25 + (Math.sin(s.phase)+1)/2*0.55;
      const d = Math.hypot(mouse.x-s.x, mouse.y-s.y);
      const near = Math.max(0, 1-d/90);
      const brightness = Math.min(1, tw + near*0.9);
      ctx.fillStyle = `rgba(237,234,224,${brightness})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + near*1.4, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function maybeSpawnShootingStar(){
    shootTimer--;
    if(shootTimer <= 0){
      shootTimer = 55 + Math.random()*100;
      const fromLeft = Math.random() < 0.5;
      const y0 = Math.random()*h*0.5;
      shootingStars.push({
        x: fromLeft ? -20 : w+20,
        y: y0,
        vx: (fromLeft ? 1 : -1) * (3 + Math.random()*2),
        vy: 1.4 + Math.random()*1,
        life: 1
      });
    }
  }

  function drawShootingStars(){
    shootingStars.forEach(s=>{
      s.x += s.vx; s.y += s.vy; s.life -= 0.012;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx*12, s.y - s.vy*12);
      grad.addColorStop(0, `rgba(242,201,76,${0.85*s.life})`);
      grad.addColorStop(1, 'rgba(242,201,76,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.1;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*12, s.y - s.vy*12);
      ctx.stroke();
    });
    shootingStars = shootingStars.filter(s => s.life > 0 && s.x > -40 && s.x < w+40 && s.y < h+40);
  }

  const moonLayer = document.createElement('canvas');
  const moonCtx = moonLayer.getContext('2d');

  function drawMoon(){
    const {mx, my, mr} = moonPos();
    const size = mr*2 + 4;

    ctx.save();
    const glow = ctx.createRadialGradient(mx, my, mr*0.6, mx, my, mr*2.4);
    glow.addColorStop(0, 'rgba(237,234,224,0.14)');
    glow.addColorStop(1, 'rgba(237,234,224,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mx, my, mr*2.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    moonLayer.width = size;
    moonLayer.height = size;
    moonCtx.clearRect(0, 0, size, size);
    const lx = size/2, ly = size/2;

    moonCtx.beginPath();
    moonCtx.arc(lx, ly, mr, 0, Math.PI*2);
    moonCtx.fillStyle = 'rgba(237,234,224,0.7)';
    moonCtx.fill();

    moonCtx.globalCompositeOperation = 'destination-out';
    moonCtx.beginPath();
    moonCtx.arc(lx + mr*0.52, ly - mr*0.26, mr, 0, Math.PI*2);
    moonCtx.fillStyle = 'rgba(0,0,0,1)';
    moonCtx.fill();
    moonCtx.globalCompositeOperation = 'source-over';

    ctx.drawImage(moonLayer, mx - lx, my - ly);
  }

  function drawPlanet(){
    const px = w-64, py = 60, pr = 20;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(px, py, pr*2.1, pr*0.55, -0.35, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(95,180,162,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.fillStyle = '#16212c';
    ctx.fill();
    ctx.fillStyle = 'rgba(242,201,76,0.28)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(242,201,76,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function step(){
    ctx.clearRect(0,0,w,h);
    drawStars();
    drawMoon();
    maybeSpawnShootingStar();
    drawShootingStars();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

/* subtle animated physics field behind simulation pages */
(function(){
  const canvas=document.getElementById('category-field');
  if(!canvas) return;
  const section=document.getElementById('category-page');
  const ctx=canvas.getContext('2d');
  let w=1,h=1, particles=[], t=0;
  const mouse={x:-9999,y:-9999};
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    w=section.clientWidth; h=section.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr;
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(34,Math.floor(w*h/15000));
    particles=Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:.6+Math.random()*1.5,phase:Math.random()*Math.PI*2,
      speed:.006+Math.random()*.014,orbit:20+Math.random()*70
    }));
  }
  resize(); window.addEventListener('resize',resize);
  section.addEventListener('mousemove',e=>{const r=section.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  section.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;});
  function frame(){
    t+=.008; ctx.clearRect(0,0,w,h);
    // faint curved field lines
    ctx.save();
    for(let i=0;i<7;i++){
      const cx=w*(.12+i*.14), cy=h*(.18+Math.sin(t*.35+i)*.06), rx=90+i*34, ry=55+i*20;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,Math.sin(i)*.35,0,Math.PI*2);
      ctx.strokeStyle=`rgba(95,180,162,${.025+i*.004})`; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();
    // particles / measurement-like nodes
    particles.forEach(p=>{
      p.phase+=p.speed;
      const ox=Math.cos(p.phase)*p.orbit*.22, oy=Math.sin(p.phase)*p.orbit*.22;
      const x=p.x+ox, y=p.y+oy;
      const d=Math.hypot(mouse.x-x,mouse.y-y), near=Math.max(0,1-d/120);
      const a=.18+near*.65+.25*(Math.sin(p.phase*2)+1)/2;
      ctx.fillStyle=`rgba(242,201,76,${Math.min(.9,a)})`;
      ctx.beginPath();ctx.arc(x,y,p.r+near*1.8,0,Math.PI*2);ctx.fill();
      if(near>.05){ctx.strokeStyle=`rgba(95,180,162,${near*.25})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

(function(){
  const path = document.querySelector('#traj-svg .traj-path');
  const dot = document.getElementById('traj-dot');
  if(!path || !dot) return;
  const len = path.getTotalLength();
  let start = null;
  const duration = 3200;
  function frame(ts){
    if(!start) start = ts;
    let progress = ((ts-start) % duration)/duration;
    const pt = path.getPointAtLength(progress*len);
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
    document.getElementById('ro-t').textContent = (progress*4).toFixed(1);
    document.getElementById('ro-v').textContent = (12 - Math.abs(progress-0.5)*10).toFixed(1);
    document.getElementById('ro-s').textContent = (progress*40).toFixed(1);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* oscillation animation (mass on a spring) */
(function(){
  const dot = document.getElementById('osc-dot');
  const spring = document.getElementById('osc-spring');
  if(!dot || !spring) return;
  const cx = 440, cy = 80, amp = 190, period = 3.0;
  let start = null;
  function frame(ts){
    if(!start) start = ts;
    const t = ((ts-start)/1000) % (period*20) / 1;
    const x = cx + amp*Math.sin((2*Math.PI/period)*t);
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', cy);
    let d = `M 30 ${cy}`;
    const coils = 14;
    for(let i=0;i<=coils;i++){
      const px = 30 + (x-30-14)*(i/coils);
      const py = cy + (i%2===0 ? -8 : 8);
      d += ` L ${px} ${py}`;
    }
    spring.setAttribute('d', d);
    const v = amp*(2*Math.PI/period)*Math.cos((2*Math.PI/period)*t);
    document.getElementById('ro-osc-t').textContent = (t%period).toFixed(1);
    document.getElementById('ro-osc-x').textContent = ((x-cx)/40).toFixed(2);
    document.getElementById('ro-osc-v').textContent = (v/40).toFixed(2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* circular motion animation */
(function(){
  const dot = document.getElementById('circ-dot');
  const radiusLine = document.getElementById('circ-radius');
  if(!dot || !radiusLine) return;
  const cx = 440, cy = 80, r = 60, omega = 1.6;
  let start = null;
  function frame(ts){
    if(!start) start = ts;
    const t = (ts-start)/1000;
    const angle = omega*t;
    const x = cx + Math.cos(angle)*r;
    const y = cy + Math.sin(angle)*r;
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    radiusLine.setAttribute('x2', x);
    radiusLine.setAttribute('y2', y);
    document.getElementById('ro-circ-t').textContent = (t % (2*Math.PI/omega)).toFixed(1);
    document.getElementById('ro-circ-w').textContent = omega.toFixed(1);
    document.getElementById('ro-circ-v').textContent = (omega*r/40).toFixed(2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
